<!doctype html>
<!--
  SOURCE TEMPLATE for docs/architecture/architecture.html.

  Do not open this file directly — it has no data in it. The generator
  (scripts/gen-architecture.mjs) reads this template, injects the generated JSON
  into the placeholder inside the arch-data script block, and writes
  docs/architecture/architecture.html.
  Edit the viewer HERE; edits to the generated file are overwritten.

  LAYOUT RULE: nothing in this page may move the viewport on click. The graph
  stays where the reader put it. Flow steps render in the right rail, node and
  drift detail render in a fixed slide-over drawer — both scroll internally.
  There are no scrollIntoView calls and no bottom panels; adding either
  reintroduces the "every click jumps to the bottom" behaviour.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture map</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#12151a; --muted:#5d6470; --line:#dfe3e9;
    --accent:#2a6df4; --accent-soft:#e8f0ff;
    --high:#c2261b; --high-bg:#fdeceb; --med:#a35b00; --med-bg:#fdf3e3; --low:#5d6470; --low-bg:#f0f2f5;
    --ok:#1f7a45; --ok-bg:#e8f6ee;
    --trigger:#7a4bd0; --client:#0b7285; --edge:#2a6df4; --module:#1f7a45; --db:#a35b00; --external:#5d6470;
    --shadow:0 8px 30px rgba(16,20,28,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e1116; --panel:#161b22; --ink:#e6e9ef; --muted:#99a1b0; --line:#2a313c;
      --accent:#5b8dff; --accent-soft:#17243f;
      --high:#ff7b72; --high-bg:#3a1d1b; --med:#e3a545; --med-bg:#33270f; --low:#99a1b0; --low-bg:#1e242d;
      --ok:#57c98a; --ok-bg:#12291d;
      --trigger:#b18ff0; --client:#4dc4d9; --edge:#5b8dff; --module:#57c98a; --db:#e3a545; --external:#99a1b0;
      --shadow:0 8px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0e1116; --panel:#161b22; --ink:#e6e9ef; --muted:#99a1b0; --line:#2a313c;
    --accent:#5b8dff; --accent-soft:#17243f;
    --high:#ff7b72; --high-bg:#3a1d1b; --med:#e3a545; --med-bg:#33270f; --low:#99a1b0; --low-bg:#1e242d;
    --ok:#57c98a; --ok-bg:#12291d;
    --trigger:#b18ff0; --client:#4dc4d9; --edge:#5b8dff; --module:#57c98a; --db:#e3a545; --external:#99a1b0;
    --shadow:0 8px 30px rgba(0,0,0,.5);
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
         display:flex; flex-direction:column;
         font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  code, .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
  button { font:inherit; }

  /* ---------- top bar: provenance must be impossible to miss ---------- */
  .topbar { flex:none; display:flex; flex-wrap:wrap; gap:9px 20px; align-items:center;
            padding:11px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  .topbar h1 { font-size:15px; margin:0 8px 0 0; font-weight:650; letter-spacing:-.01em; }
  .meta { display:flex; flex-direction:column; gap:0; }
  .meta .k { font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
  .meta .v { font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .pill { padding:3px 9px; border-radius:999px; font-size:11px; font-weight:650;
          border:1px solid transparent; white-space:nowrap; }
  .pill.ok   { background:var(--ok-bg);   color:var(--ok);   border-color:var(--ok); }
  .pill.med  { background:var(--med-bg);  color:var(--med);  border-color:var(--med); }
  .pill.high { background:var(--high-bg); color:var(--high); border-color:var(--high); }
  .pill.btn  { cursor:pointer; }
  .spacer { flex:1; }
  .ghost { background:none; border:1px solid var(--line); color:var(--muted);
           border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; }
  .ghost:hover { border-color:var(--accent); color:var(--accent); }

  /* ---------- alert strip (collapsible, never pushes the graph off-screen) ---------- */
  .alerts { flex:none; max-height:38vh; overflow-y:auto; }
  .banner { padding:11px 18px; border-bottom:1px solid var(--line); }
  .banner.stale { background:var(--high-bg); border-left:5px solid var(--high); }
  .banner.warn  { background:var(--med-bg);  border-left:5px solid var(--med); }
  .banner h2 { margin:0; font-size:13px; font-weight:700; }
  .banner.stale h2 { color:var(--high); }
  .banner.warn h2  { color:var(--med); }
  .banner summary { cursor:pointer; user-select:none; list-style:revert; }
  .banner summary h2 { display:inline; }
  .banner ul { margin:8px 0 0; padding-left:20px; }
  .banner li { margin:5px 0; font-size:12.5px; }
  .banner .why { color:var(--muted); }

  /* ---------- main: graph + rail, both fill the viewport ---------- */
  main { flex:1; display:flex; min-height:0; }
  /* NO top padding. A sticky header pins to the scrollport edge, which for a padded
     scroll container is the PADDING box — so any top padding leaves a strip above the
     pinned header where cards scroll past in full view. The header's own padding-top
     supplies the spacing instead, so its background paints that strip. */
  .graphwrap { flex:1; position:relative; overflow:auto; padding:0 18px 18px; min-width:0; }
  /* align-items must STRETCH, not flex-start. A sticky header can only stick inside its
     own parent's box, so a short column (Pure modules has 3 cards) would let its header
     scroll away while the tall columns kept theirs pinned. Stretching makes every .col
     as tall as the tallest, so all six headers stay pinned for the whole scroll. */
  .columns { display:flex; gap:24px; min-width:min-content; position:relative; z-index:2; align-items:stretch; }
  .col { flex:0 0 186px; }
  /* margin-bottom would be a transparent band under the pinned header — cards would show
     through it. Use padding so the background covers the whole gap, above and below. */
  .col > h3 { margin:0; font-size:9.5px; text-transform:uppercase; letter-spacing:.09em;
              color:var(--muted); font-weight:700; position:sticky; top:0;
              background:var(--bg); padding:18px 0 10px; z-index:3; }
  .col[data-layer="trigger"]  > h3 { color:var(--trigger); }
  .col[data-layer="client"]   > h3 { color:var(--client); }
  .col[data-layer="edge"]     > h3 { color:var(--edge); }
  .col[data-layer="module"]   > h3 { color:var(--module); }
  .col[data-layer="db"]       > h3 { color:var(--db); }
  .col[data-layer="external"] > h3 { color:var(--external); }

  .node { background:var(--panel); border:1px solid var(--line); border-left-width:3px;
          border-radius:7px; padding:7px 9px; margin-bottom:7px; cursor:pointer;
          transition:opacity .12s, border-color .12s, box-shadow .12s; }
  .node:hover { border-color:var(--accent); }
  .node .lbl { font-size:12px; font-weight:600; word-break:break-word; }
  .node .sub { font-size:10.5px; color:var(--muted); margin-top:2px; word-break:break-word;
               font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .node[data-layer="trigger"]  { border-left-color:var(--trigger); }
  .node[data-layer="client"]   { border-left-color:var(--client); }
  .node[data-layer="edge"]     { border-left-color:var(--edge); }
  .node[data-layer="module"]   { border-left-color:var(--module); }
  .node[data-layer="db"]       { border-left-color:var(--db); }
  .node[data-layer="external"] { border-left-color:var(--external); }
  .node.dim { opacity:.15; }
  .node.on  { box-shadow:0 0 0 2px var(--accent); border-color:var(--accent); }
  .node.step { position:relative; }
  .node.step::after { content:attr(data-step); position:absolute; top:-7px; left:-8px;
                      width:19px; height:19px; border-radius:50%; background:var(--accent); color:#fff;
                      font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; z-index:4; }
  .node .flags { display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .flag { font-size:9px; padding:1px 5px; border-radius:3px; font-weight:700; }
  .flag.high { background:var(--high-bg); color:var(--high); }
  .flag.med  { background:var(--med-bg);  color:var(--med); }
  .flag.low  { background:var(--low-bg);  color:var(--low); }
  .flag.unv  { background:var(--high-bg); color:var(--high); }
  .flag.note { background:var(--accent-soft); color:var(--accent); }

  /* Pinned to the padding-box origin and offset purely in JS from measured rects, so
     changing .graphwrap's padding can never desync the wires from the cards again. */
  svg.wires { position:absolute; top:0; left:0; z-index:1; pointer-events:none; overflow:visible; }
  svg.wires path { fill:none; stroke:var(--accent); stroke-width:1.8; opacity:.8; }
  svg.wires circle { fill:var(--accent); }
  svg.wires text { fill:#fff; font:700 10px ui-sans-serif,sans-serif; text-anchor:middle; }

  /* ---------- right rail: flow list OR the selected flow's steps ---------- */
  .rail { flex:0 0 348px; border-left:1px solid var(--line); background:var(--panel);
          display:flex; flex-direction:column; min-height:0; }
  .railhead { flex:none; padding:12px 14px; border-bottom:1px solid var(--line); }
  .railhead h3 { margin:0; font-size:9.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); }
  .railhead .ftitle { font-size:14px; font-weight:650; margin-top:3px; }
  .railhead .ftrig { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .railbody { flex:1; overflow-y:auto; padding:10px 14px 18px; }
  .railfoot { flex:none; padding:10px 14px; border-top:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; }

  .flow { padding:8px 10px; border-radius:6px; cursor:pointer; border:1px solid transparent; margin-bottom:3px; }
  .flow:hover { background:var(--accent-soft); }
  .flow .t { font-size:12.5px; font-weight:600; }
  .flow .tr { font-size:10.5px; color:var(--muted); margin-top:2px; }
  .back { background:none; border:none; color:var(--accent); cursor:pointer; padding:0; font-size:11.5px; margin-bottom:6px; }

  .anno { background:var(--accent-soft); border-left:3px solid var(--accent);
          padding:9px 11px; border-radius:0 6px 6px 0; font-size:12.5px; margin:0 0 12px; }
  ol.steps { margin:0; padding:0; list-style:none; }
  ol.steps li { display:grid; grid-template-columns:22px 1fr; gap:9px; padding:9px 0;
                border-top:1px solid var(--line); cursor:pointer; }
  ol.steps li:first-child { border-top:none; }
  ol.steps li:hover { background:var(--accent-soft); }
  ol.steps li.on { background:var(--accent-soft); }
  .num { width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff;
         display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; }
  .stepbody .path { font-size:10.5px; color:var(--muted); font-family:ui-monospace,Menlo,monospace;
                    margin-bottom:3px; word-break:break-word; }
  .stepbody .det { font-size:12.5px; }
  .cites { margin-top:5px; display:flex; flex-wrap:wrap; gap:4px; }
  .cite { font-size:10px; font-family:ui-monospace,Menlo,monospace; background:var(--low-bg);
          color:var(--muted); padding:2px 5px; border-radius:4px; word-break:break-all; }
  .proto { display:inline-block; font-size:9.5px; font-weight:700; padding:1px 5px;
           border-radius:3px; background:var(--low-bg); color:var(--muted); margin-left:5px; }

  /* ---------- drawer: node + drift detail, fixed, never moves the page ---------- */
  .scrim { position:fixed; inset:0; background:rgba(10,14,20,.28); opacity:0; pointer-events:none;
           transition:opacity .16s; z-index:40; }
  .scrim.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100%; width:min(560px, 92vw); background:var(--panel);
            border-left:1px solid var(--line); box-shadow:var(--shadow); z-index:41;
            transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column; }
  .drawer.open { transform:none; }
  .drawerhead { flex:none; padding:14px 16px; border-bottom:1px solid var(--line);
                display:flex; align-items:flex-start; gap:10px; }
  .drawerhead h2 { margin:0; font-size:15px; word-break:break-word; }
  .drawerhead .sub { font-size:11px; color:var(--muted); margin-top:3px; word-break:break-all; }
  .drawerbody { flex:1; overflow-y:auto; padding:14px 16px 28px; }
  .drawerbody h3 { font-size:11px; text-transform:uppercase; letter-spacing:.07em;
                   color:var(--muted); margin:16px 0 6px; }
  .drawerbody h3:first-child { margin-top:0; }
  .drawerbody pre { background:var(--low-bg); padding:10px; border-radius:6px; overflow-x:auto;
                    margin:0; font-size:11.5px; }
  .drawerbody ul { margin:0; padding-left:17px; }
  .close { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px;
           width:28px; height:28px; cursor:pointer; flex:none; line-height:1; }
  .close:hover { border-color:var(--accent); color:var(--accent); }

  .dcard { border-radius:7px; padding:10px 12px; margin-bottom:9px; }
  .dcard.high { background:var(--high-bg); border-left:4px solid var(--high); }
  .dcard.medium { background:var(--med-bg); border-left:4px solid var(--med); }
  .dcard.low { background:var(--low-bg); border-left:4px solid var(--low); }
  .dcard .obj { font-size:12px; font-weight:700; margin-bottom:5px; }
  .says { font-family:ui-monospace,Menlo,monospace; font-size:11px; display:block; margin:1px 0; word-break:break-word; }
  .dcard .why { color:var(--muted); font-size:12px; margin-top:6px; }
  .lede { color:var(--muted); font-size:12.5px; margin:0 0 14px; }
  .hidden { display:none; }

  @media (max-width: 900px) {
    body { overflow:auto; }
    main { flex-direction:column; }
    .graphwrap { overflow-x:auto; }
    .rail { flex:none; width:100%; border-left:none; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>Architecture map</h1>
  <div class="meta"><span class="k">Commit</span><span class="v" id="m-commit">—</span></div>
  <div class="meta"><span class="k">Generated</span><span class="v" id="m-gen">—</span></div>
  <div class="meta"><span class="k">Source hash</span><span class="v" id="m-hash">—</span></div>
  <span class="pill" id="m-db">db snapshot</span>
  <span class="pill" id="m-dirty"></span>
  <div class="spacer"></div>
  <button class="ghost" id="driftbtn">Claim vs reality</button>
  <button class="ghost" id="themebtn">Theme</button>
</header>

<div class="alerts" id="banners"></div>

<main>
  <div class="graphwrap" id="graphwrap">
    <svg class="wires" id="wires"></svg>
    <div class="columns" id="columns"></div>
  </div>

  <aside class="rail">
    <div class="railhead" id="railhead"><h3>Flows</h3></div>
    <div class="railbody" id="railbody"></div>
    <div class="railfoot">
      <button class="ghost" id="clearflow">Clear</button>
      <button class="ghost" id="hidetoggle">Hide off-path</button>
    </div>
  </aside>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawerhead">
    <div style="flex:1;min-width:0">
      <h2 id="d-title">—</h2>
      <div class="sub" id="d-sub"></div>
    </div>
    <button class="close" id="d-close" aria-label="Close">&times;</button>
  </div>
  <div class="drawerbody" id="d-body"></div>
</aside>

<script type="application/json" id="arch-data">
__ARCHITECTURE_JSON__
</script>

<script>
(function () {
  const D = JSON.parse(document.getElementById('arch-data').textContent);
  const byId = new Map(D.nodes.map(n => [n.id, n]));
  const edgeById = new Map(D.edges.map(e => [e.id, e]));
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- provenance ----------
  el('m-commit').textContent = D.generated.commitShort + ' (' + D.generated.branch + ')';
  el('m-gen').textContent = D.generated.timestamp.replace('T', ' ').replace('Z', ' UTC');
  el('m-hash').textContent = D.generated.sourceHash.replace('sha256:', '').slice(0, 12);
  const dirty = el('m-dirty');
  if (D.generated.dirty) { dirty.textContent = 'built from a dirty tree'; dirty.className = 'pill med'; }
  else dirty.remove();

  const db = D.dbSnapshot, dbPill = el('m-db');
  if (!db.present) { dbPill.textContent = 'NO DB SNAPSHOT'; dbPill.className = 'pill high'; }
  else {
    const d = db.ageDays;
    dbPill.textContent = 'db snapshot ' + (d < 1 ? Math.max(1, Math.round(db.ageHours)) + 'h old' : d + 'd old');
    dbPill.className = 'pill ' + (db.stale ? 'high' : d > db.staleAfterDays / 2 ? 'med' : 'ok');
    dbPill.title = 'Captured ' + db.capturedAt + ' · stale after ' + db.staleAfterDays + ' days';
  }

  // ---------- loud banners (collapsible so they never bury the graph) ----------
  const high = D.drift.filter(r => r.severity === 'high');
  const banners = [];
  if (!db.present) banners.push({ cls: 'stale', open: true,
    h: 'This map does not know anything about the database.',
    body: '<p>No <code>docs/architecture/db-snapshot.json</code>. Every function ACL, search_path pin, RLS policy and cron job below is <b>unknown</b> — not verified-absent. Run <code>docs/architecture/db-snapshot.sql</code> against prod and save the output.</p>' });
  else if (db.stale) banners.push({ cls: 'stale', open: true,
    h: 'Database snapshot is ' + db.ageDays + ' days old.',
    body: '<p>Past the ' + db.staleAfterDays + '-day limit. Grants, policies and cron schedules below may no longer match prod.</p>' });

  if (high.length) banners.push({ cls: 'stale', open: true,
    h: high.length + ' high-severity claim-vs-reality mismatch' + (high.length > 1 ? 'es' : ''),
    body: '<ul>' + high.map(r => '<li><b>' + esc(r.label) + '</b> — ' + esc(r.note) +
      '<div class="why">migration says: <code>' + esc(r.declared) + '</code><br>database says: <code>' + esc(r.live) + '</code></div></li>').join('') + '</ul>' });

  if (D.unverified.length) banners.push({ cls: 'warn', open: false,
    h: D.unverified.length + ' thing' + (D.unverified.length > 1 ? 's' : '') + ' this map could NOT verify',
    body: '<ul>' + D.unverified.map(u => '<li><b>' + esc(u.scope) + '</b> — ' + esc(u.claim) +
      '<div class="why">' + esc(u.reason) + '<br>resolve: <code>' + esc(u.resolve) + '</code></div></li>').join('') + '</ul>' });

  el('banners').innerHTML = banners.map(b =>
    '<div class="banner ' + b.cls + '"><details' + (b.open ? ' open' : '') +
    '><summary><h2>' + esc(b.h) + '</h2></summary>' + b.body + '</details></div>').join('');

  // ---------- columns ----------
  const driftByNode = new Map();
  for (const r of D.drift) { if (!driftByNode.has(r.node)) driftByNode.set(r.node, []); driftByNode.get(r.node).push(r); }

  el('columns').innerHTML = D.layers.map(L => {
    const ns = D.nodes.filter(n => n.layer === L.id);
    return '<div class="col" data-layer="' + L.id + '"><h3>' + esc(L.label) + ' · ' + ns.length + '</h3>' +
      ns.map(n => {
        const dr = driftByNode.get(n.id) || [];
        const worst = dr.some(d => d.severity === 'high') ? 'high' : dr.some(d => d.severity === 'medium') ? 'med' : dr.length ? 'low' : null;
        const flags = [];
        if (worst) flags.push('<span class="flag ' + worst + '">drift ' + dr.length + '</span>');
        if (!n.verified) flags.push('<span class="flag unv">unverified</span>');
        if (n.annotation) flags.push('<span class="flag note">note</span>');
        return '<div class="node" data-layer="' + L.id + '" data-id="' + esc(n.id) + '">' +
          '<div class="lbl">' + esc(n.label) + '</div>' +
          (n.sublabel ? '<div class="sub">' + esc(n.sublabel) + '</div>' : '') +
          (flags.length ? '<div class="flags">' + flags.join('') + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  }).join('');

  // ---------- state ----------
  let currentFlow = null, hideOff = false, activeStep = null;
  const nodeEl = (id) => document.querySelector('.node[data-id="' + CSS.escape(id) + '"]');

  function edgesOfStep(s) { return (Array.isArray(s.edge) ? s.edge : [s.edge]).map(id => edgeById.get(id)).filter(Boolean); }

  function drawWires() {
    const svg = el('wires');
    svg.innerHTML = '';
    if (!currentFlow) return;
    const wrap = el('graphwrap');
    const wr = wrap.getBoundingClientRect();
    const ox = wr.left - wrap.scrollLeft;
    const oy = wr.top - wrap.scrollTop;
    const NS = 'http://www.w3.org/2000/svg';
    for (const step of currentFlow.steps) {
      const focused = activeStep === null || activeStep === step.n;
      for (const e of edgesOfStep(step)) {
        const a = nodeEl(e.from), b = nodeEl(e.to);
        if (!a || !b || a.classList.contains('hidden') || b.classList.contains('hidden')) continue;
        const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        const x1 = ra.right - ox, y1 = ra.top + ra.height / 2 - oy;
        const x2 = rb.left - ox,  y2 = rb.top + rb.height / 2 - oy;
        const mx = (x1 + x2) / 2;
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
        p.setAttribute('opacity', focused ? '.85' : '.12');
        svg.appendChild(p);
        if (!focused) continue;
        // Stagger badges along the curve: one source often fans out to many targets,
        // so every curve shares a midpoint x and the numbers would stack into a pile.
        const t = 0.34 + ((step.n - 1) % 5) * 0.11, u = 1 - t;
        const bez = (P0, P1, P2, P3) => u*u*u*P0 + 3*u*u*t*P1 + 3*u*t*t*P2 + t*t*t*P3;
        const bx = bez(x1, mx, mx, x2), by = bez(y1, y1, y2, y2);
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', 9);
        svg.appendChild(c);
        const tx = document.createElementNS(NS, 'text');
        tx.setAttribute('x', bx); tx.setAttribute('y', by + 3.5); tx.textContent = step.n;
        svg.appendChild(tx);
      }
    }
  }

  function paintNodes() {
    const inPath = new Set(currentFlow ? currentFlow.nodePath : []);
    const stepOf = new Map();
    if (currentFlow) for (const s of currentFlow.steps) for (const e of edgesOfStep(s)) if (!stepOf.has(e.to)) stepOf.set(e.to, s.n);
    document.querySelectorAll('.node').forEach(nd => {
      const on = currentFlow && inPath.has(nd.dataset.id);
      nd.classList.toggle('on', !!on);
      nd.classList.toggle('dim', !!currentFlow && !on && !hideOff);
      nd.classList.toggle('hidden', !!currentFlow && !on && hideOff);
      const sn = on ? stepOf.get(nd.dataset.id) : null;
      nd.classList.toggle('step', sn != null);
      if (sn != null) nd.dataset.step = sn; else delete nd.dataset.step;
    });
  }

  function renderRail() {
    const head = el('railhead'), body = el('railbody');
    if (!currentFlow) {
      head.innerHTML = '<h3>Flows</h3>';
      body.innerHTML = D.flows.map(f =>
        '<div class="flow" data-id="' + esc(f.id) + '"><div class="t">' + esc(f.title) + '</div>' +
        '<div class="tr">' + esc(f.trigger.kind) + ' · ' + f.steps.length + ' steps</div></div>').join('');
      return;
    }
    head.innerHTML = '<button class="back" id="backbtn">&larr; All flows</button>' +
      '<div class="ftitle">' + esc(currentFlow.title) + '</div>' +
      '<div class="ftrig">' + esc(currentFlow.trigger.detail) + '</div>';
    body.innerHTML = (currentFlow.annotation ? '<div class="anno">' + esc(currentFlow.annotation) + '</div>' : '') +
      '<ol class="steps">' + currentFlow.steps.map(s => {
        const e = edgesOfStep(s)[0];
        const path = e ? (byId.get(e.from)?.label || e.from) + ' → ' + (byId.get(e.to)?.label || e.to) : String(s.edge);
        return '<li data-step="' + s.n + '"' + (activeStep === s.n ? ' class="on"' : '') + '>' +
          '<div class="num">' + s.n + '</div><div class="stepbody">' +
          '<div class="path">' + esc(path) + (e ? '<span class="proto">' + esc(e.protocol) + '</span>' : '') + '</div>' +
          '<div class="det">' + esc(s.detail) + '</div>' +
          (e && e.annotation ? '<div class="anno" style="margin:7px 0 0">' + esc(e.annotation) + '</div>' : '') +
          (s.files && s.files.length ? '<div class="cites">' + s.files.map(f => '<span class="cite">' + esc(f) + '</span>').join('') + '</div>' : '') +
          '</div></li>';
      }).join('') + '</ol>';
  }

  function selectFlow(flow) {
    currentFlow = flow; activeStep = null;
    renderRail(); paintNodes();
    requestAnimationFrame(drawWires);
  }

  // ---------- rail interactions (no viewport movement anywhere) ----------
  el('railbody').addEventListener('click', ev => {
    const f = ev.target.closest('.flow');
    if (f) { selectFlow(D.flows.find(x => x.id === f.dataset.id)); return; }
    const li = ev.target.closest('li[data-step]');
    if (li) {
      const n = +li.dataset.step;
      activeStep = activeStep === n ? null : n;
      renderRail(); drawWires();
    }
  });
  el('railhead').addEventListener('click', ev => { if (ev.target.id === 'backbtn') selectFlow(null); });
  el('clearflow').addEventListener('click', () => selectFlow(null));
  el('hidetoggle').addEventListener('click', ev => {
    hideOff = !hideOff;
    ev.target.textContent = hideOff ? 'Show all' : 'Hide off-path';
    paintNodes(); requestAnimationFrame(drawWires);
  });

  // ---------- drawer ----------
  function openDrawer(title, sub, html) {
    el('d-title').textContent = title;
    el('d-sub').innerHTML = sub;
    el('d-body').innerHTML = html;
    el('drawer').classList.add('open');
    el('scrim').classList.add('open');
  }
  function closeDrawer() { el('drawer').classList.remove('open'); el('scrim').classList.remove('open'); }
  el('d-close').addEventListener('click', closeDrawer);
  el('scrim').addEventListener('click', closeDrawer);
  addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDrawer(); });

  const driftCard = (r, withObj) =>
    '<div class="dcard ' + r.severity + '">' + (withObj ? '<div class="obj">' + esc(r.label) + ' · ' + esc(r.field) + '</div>' : '') +
    '<span class="says"><b>migration says:</b> ' + esc(r.declared) + '</span>' +
    '<span class="says"><b>database says:</b> ' + esc(r.live) + '</span>' +
    '<div class="why">' + esc(r.note) + '</div></div>';

  el('driftbtn').addEventListener('click', () => {
    openDrawer('Claim vs reality', D.drift.length + ' mismatches · ' + high.length + ' high severity',
      '<p class="lede">Every place the repo\'s migrations disagree with what prod actually has. Migration text is a claim; <code>db-snapshot.json</code> is the evidence. <code>REVOKE … FROM PUBLIC</code> does not clear Supabase\'s default <code>anon</code>/<code>authenticated</code> grants, and <code>CREATE OR REPLACE FUNCTION</code> does not reset privileges — so "the migration says it is locked down" is never evidence that it is.</p>' +
      D.drift.map(r => driftCard(r, true)).join(''));
  });

  el('columns').addEventListener('click', ev => {
    const nd = ev.target.closest('.node'); if (!nd) return;
    const n = byId.get(nd.dataset.id); if (!n) return;
    const parts = [];
    if (n.annotation) parts.push('<div class="anno">' + esc(n.annotation) + '</div>');
    const dr = driftByNode.get(n.id) || [];
    if (dr.length) parts.push('<h3>Claim vs reality</h3>' + dr.map(r => driftCard(r, false)).join(''));
    const pre = (t, o) => '<h3>' + t + '</h3><pre class="mono">' + esc(JSON.stringify(o, null, 2)) + '</pre>';
    if (n.db) parts.push(pre('Live database facts', n.db));
    if (n.declared) parts.push(pre('Declared by migrations', n.declared));
    if (n.facts && Object.keys(n.facts).length) parts.push(pre('Derived from files', n.facts));
    const list = (es, dir) => es.length ? '<h3>' + dir + ' (' + es.length + ')</h3><ul>' + es.map(e =>
      '<li style="margin:5px 0"><code>' + esc(dir === 'Inbound' ? e.from : e.to) + '</code><span class="proto">' + esc(e.protocol) + '</span>' +
      '<div class="cites">' + e.callSites.map(c => '<span class="cite">' + esc(c) + '</span>').join('') + '</div></li>').join('') + '</ul>' : '';
    parts.push(list(D.edges.filter(e => e.to === n.id), 'Inbound'));
    parts.push(list(D.edges.filter(e => e.from === n.id), 'Outbound'));
    openDrawer(n.label, '<code>' + esc(n.id) + '</code> · ' + esc(n.kind) +
      (n.source ? ' · <code>' + esc(n.source.path) + ':' + n.source.line + '</code>' : ''), parts.join(''));
  });

  // ---------- theme ----------
  el('themebtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    requestAnimationFrame(drawWires);
  });

  addEventListener('resize', drawWires);
  el('graphwrap').addEventListener('scroll', drawWires);
  el('banners').addEventListener('toggle', () => requestAnimationFrame(drawWires), true);

  renderRail();
})();
</script>
</body>
</html>
