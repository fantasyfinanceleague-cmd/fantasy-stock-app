
[functions.quote]
enabled = true
verify_jwt = true
import_map = "./functions/quote/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/quote/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/quote/*.html" ]

# Phase 2b-2: cron auth migration. JWT verification disabled so the function is
# reachable without a legacy JWT; the function's own apikey-header validation
# (SB_SECRET_KEY_CRON, constant-time, fail-closed) is the authentication guard.
# (Before 2b-2 this was verify_jwt=false with NO guard — publicly unauthenticated.)
[functions.process-week-results]
enabled = true
verify_jwt = false
entrypoint = "./functions/process-week-results/index.ts"

# Phase 2b-1: cron auth migration. JWT verification disabled so the function is
# reachable without a legacy JWT; the function's own apikey-header validation
# (SB_SECRET_KEY_CRON, constant-time, fail-closed) is the authentication guard.
[functions.snapshot-week-end]
verify_jwt = false

# Phase 2b-2 (Sub-phase B): cron auth migration. JWT verification disabled so the
# function is reachable without a legacy JWT; the function's own apikey-header
# validation (SB_SECRET_KEY_CRON, constant-time, fail-closed) is the auth guard.
[functions.snapshot-week-start]
verify_jwt = false

# RLS-hardening: refresh-symbols is invoked by authenticated users from the
# client. Platform JWT verification is the auth: any caller with a valid user
# JWT is allowed; anonymous callers are rejected with 401 at the gateway.
# Previously this function had NO block and NO guard — publicly callable,
# RLS-bypassing upsert. NOTE: verify_jwt=true authorizes ALL authenticated
# callers, not just admins; the upsert uses SB_SECRET_KEY_INTERNAL (bypasses
# RLS), so any authenticated user who calls this can rewrite the symbols table.
[functions.refresh-symbols]
enabled = true
verify_jwt = true
entrypoint = "./functions/refresh-symbols/index.ts"

# RLS-hardening (preview/join pair): server-side by-code league PREVIEW. verify_jwt
# ensures both clients preview post-login (web /join/:code is <Protected>; mobile
# lookupCode requires user). The by-code lookup uses SB_SECRET_KEY_INTERNAL
# (RLS-bypass) so leagues/league_members/league_invites stay members-only to
# clients. Rate-limited (per-user + per-IP, fail-open) so it isn't an enumeration
# oracle. Returns display-only fields — no id/commissioner_id/invite_code.
[functions.preview-league]
enabled = true
verify_jwt = true
entrypoint = "./functions/preview-league/index.ts"

# RLS-hardening (preview/join pair): atomic server-side JOIN. verify_jwt=true. The
# mutation runs in join_league_by_code (SECURITY DEFINER, EXECUTE granted to
# service_role ONLY), so league_members inserts + league_invites accept-updates
# never touch the client. Retires interim policy [I7].
[functions.join-league]
enabled = true
verify_jwt = true
entrypoint = "./functions/join-league/index.ts"

# ============================================================================
# verify_jwt for the remaining 7 functions — READ OFF THE DASHBOARD 2026-07-30
# ============================================================================
# These had NO [functions.*] block, so the repo recorded nothing and the platform
# default applied. All 15 deployed functions are now declared here, making the
# repo the source of truth rather than the dashboard.
#
# CROSS-CHECK PASSED: the 5 values this file already asserted were confirmed
# against prod — the four cron functions OFF, quote ON. First time a config.toml
# assertion in this repo has been *confirmed* rather than assumed.
#
# WHAT verify_jwt ACTUALLY CHECKS (from the dashboard toggle's own description):
#   "Verify JWT with legacy secret — Requires a JWT signed only by the legacy
#    secret in the Authorization header. The anon key satisfies this."
# So it inspects the AUTHORIZATION header for a legacy-secret-signed JWT. An
# `apikey` header cannot satisfy it, and a new-format sb_secret_/sb_publishable_
# key cannot satisfy it even in the right header, because those are opaque
# strings rather than JWTs. User SESSION JWTs are signed by the project's JWT
# secret, which is why client calls to verify_jwt=true functions work. This is
# the fact that settles the refresh-symbols cron (see
# 20260728000002_fix_refresh_symbols_cron_auth.sql).
#
# REMOVED (in-house simulator migration, DR-001): the two per-user broker-
# credential functions — save-broker-keys (wrote AES-GCM-encrypted Alpaca creds)
# and place-order (executed trades with the caller's decrypted creds) — plus
# cron-only sync-alpaca-orders. User broker-credential custody is retired; Alpaca
# remains ONLY as the shared server-side market-data vendor (quote / ticker-quotes
# / historical-bars / symbols-search). Dropping the broker_credentials table is a
# pending HUMAN ACTION migration authored in this branch.
# ============================================================================

# Market data, no per-user credentials — uses the shared server-side
# ALPACA_API_KEY. verify_jwt=true is the ONLY auth (no in-code guard), so the
# gateway is the entire boundary for these three.
[functions.historical-bars]
enabled = true
verify_jwt = true
entrypoint = "./functions/historical-bars/index.ts"

[functions.symbol-name]
enabled = true
verify_jwt = true
entrypoint = "./functions/symbol-name/index.ts"

[functions.symbols-search]
enabled = true
verify_jwt = true
entrypoint = "./functions/symbols-search/index.ts"

[functions.finnhub-quote]
enabled = true
verify_jwt = true
entrypoint = "./functions/finnhub-quote/index.ts"

# ⚠️ THE ODD ONE OUT — verify_jwt = FALSE, and it has NO in-code guard either, so
# it is fully anon-callable. It is the only market-data function that is; quote,
# historical-bars, symbol-name and symbols-search are all ON.
#
# DELIBERATE IN ORIGIN, not a mis-set toggle:
#   * apps/web/src/Ticker.jsx:27 states the intent in a comment — "uses
#     server-side keys, no auth required".
#   * Structurally it has to be. <Ticker /> renders at Layout.jsx:17, and App.jsx
#     nests the gate INSIDE the layout — <Layout><Protected>…</Protected></Layout>.
#     So Layout (and Ticker) mount BEFORE Protected resolves, including during
#     its `user === null` "Checking session…" window and for an unauthenticated
#     visitor hitting a protected URL before the redirect lands. With verify_jwt
#     ON, the ticker would 401 in exactly those windows.
#
# BUT THE CONSEQUENCE IS REAL AND ALREADY LOGGED: this is the concrete instance
# of RLS_HARDENING_SPEC L4 — an anon-callable endpoint that burns Alpaca quota
# with no caller identity and no rate limit. Unlike refresh-symbols (L7) it takes
# a caller-supplied symbol, so it is a cheap unauthenticated proxy to Alpaca.
# If L4 is ever actioned, the fix is a rate limit (check_and_bump_rate_limit,
# keyed per-IP since there is no user), NOT flipping this flag — flipping it
# breaks the ticker for the reason above. Do not "normalise" it to match its
# siblings without reading this.
[functions.ticker-quotes]
enabled = true
verify_jwt = false
entrypoint = "./functions/ticker-quotes/index.ts"
