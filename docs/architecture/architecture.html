dy parse and before the DB client is constructed, which is what makes an unauthenticated request cheap to reject. The two extracted modules are the parts that have been burned by bugs and are now pinned by hermetic unit tests.\n\nSTRANDED STATUS ROWS (traced 2026-07-27). It writes 'running' to cron_job_status at index.ts:851, but terminal statuses exist at only two places: 'success' at :1463 and 'failed' at :1477. Two returns sit between them and write NEITHER, leaving the row permanently at 'running':\n  - :890 — no pending matchups. Returns HTTP 200, logs 'No pending matchups to process'. This is the common path.\n  - :885 — the matchup query itself failed. Returns HTTP 500, logs 'Error fetching matchups:'.\nDiscriminate the two by status code or by that log line. The three returns before :851 (:819 apikey rejected, :832 missing config) write no row at all, which is a different and less confusing state. :1311 and :1325 are returns inside the nested updateUserStandings helper, not handler returns.\n\nNOT A SCORING OUTAGE. Five consecutive Fridays (2026-06-26 through 07-24) sat at 'running'. `unscored` was confirmed 0 across every league — no matchups with team1_gain IS NULL and week_end \u003c now() — so :890 firing weekly is the function correctly reporting there is nothing to score. The stranded row is the entire finding. Do not read those five rows as five missed scoring runs.\n\nSee CLAUDE.md silent-failure #6 for why this shape is worse than a merely wrong signal.","verified":true,"id":"fn.process-week-results","label":"process-week-results","sublabel":"verify_jwt=false · apikey guard","kind":"edge-function","source":{"path":"supabase/functions/process-week-results/index.ts","line":843}},{"layer":"edge","facts":{"verifyJwt":true,"verifyJwtSource":"supabase/config.toml:2","authGuard":null,"localModules":[],"tests":[],"envVars":["BROKER_CRYPTO_KEY","SB_PUBLISHABLE_KEY","SB_SECRET_KEY_INTERNAL","SUPABASE_URL"],"lines":441},"db":null,"declared":null,"drift":[],"annotation":null,"verified":true,"id":"fn.quote","label":"quote","sublabel":"verify_jwt=true","kind":"edge-function","source":{"path":"supabase/functions/quote/index.ts","line":224}},{"layer":"edge","facts":{"verifyJwt":true,"verifyJwtSource":"supabase/config.toml:50","authGuard":null,"localModules":[],"tests":[],"envVars":["SB_SECRET_KEY_INTERNAL","SUPABASE_URL"],"lines":138},"db":null,"declared":null,"drift":[],"annotation":null,"verified":true,"id":"fn.refresh-symbols","label":"refresh-symbols","sublabel":"verify_jwt=true","kind":"edge-function","source":{"path":"supabase/functions/refresh-symbols/index.ts","line":53}},{"layer":"edge","facts":{"verifyJwtSource":null,"authGuard":null,"localModules":[],"tests":[],"envVars":["BROKER_CRYPTO_KEY","SB_PUBLISHABLE_KEY","SB_SECRET_KEY_INTERNAL","SUPABASE_URL"],"lines":151},"db":null,"declared":null,"drift":[],"annotation":null,"verified":false,"id":"fn.save-broker-keys","label":"save-broker-keys","sublabel":"verify_jwt unset","kind":"edge-function","source":{"path":"supabase/functions/save-broker-keys/index.ts","line":89}},{"layer":"edge","facts":{"verifyJwt":false,"verifyJwtSource":"supabase/config.toml:25","authGuard":"apikey header, constant-time, fail-closed","localModules":["close.ts"],"tests":["close.test.ts"],"envVars":["ALPACA_API_KEY","ALPACA_API_SECRET","SB_SECRET_KEY_CRON","SB_SECRET_KEY_INTERNAL","SUPABASE_URL"],"lines":505},"db":null,"declared":null,"drift":[],"annotation":"MODERNISED 2026-07-28 — the last live instance of the partial-state pattern is closed. Decision logic now lives in the pure, hermetically tested close.ts (22 tests), mirroring snapshot-week-start/plan.ts.\n\nTHE GUARD IT REPLACED: `alreadyProcessed = existingSnapshots.some(s => s.week_end_price != null)`. ANY single end-priced row marked the WHOLE league-week done, so a run that priced some participants and then threw left a partial write that the retry SKIPPED rather than healed. It also made retries into this function ineffective even after schedule_snapshot_retry was fixed in 20260727000000 — the retry fired and no-opped.\n\nWHY close.ts IS NOT SYMMETRICAL WITH plan.ts, deliberately: week-START has one write path (insert per holding); week-END has TWO, so 'missing' has two kinds. KIND 1 is an existing Monday row whose week_end_price is still NULL (resolve by UPDATE on id). KIND 2 is a mid-week buy with no row at all (resolve by INSERT carrying entered_mid_week=true and the weighted entry price as week_start_price). Completeness is the CONJUNCTION of both, per participant — checking only kind 1 would call a league complete while a mid-week buy went unrecorded.\n\nThe coverage gate runs BEFORE the Alpaca call, so a complete league costs no quota. Writes are all-or-nothing: one unpriceable symbol aborts the whole league (buildCloseWork returns empty updates AND inserts alongside missingSymbols, so a careless caller cannot write a subset). Inserts upsert on (league_id,user_id,week_number,symbol), so overlapping retries re-converge. anyIncomplete now forces terminal status 'retrying'/'failed' — a partial run can no longer report 'success'.","verified":true,"id":"fn.snapshot-week-end","label":"snapshot-week-end","sublabel":"verify_jwt=false · apikey guard","kind":"edge-function","source":{"path":"supabase/functions/snapshot-week-end/index.ts","line":234}},{"layer":"edge","facts":{"verifyJwt":false,"verifyJwtSource":"supabase/config.toml:31","authGuard":"apikey header, constant-time, fail-closed","localModules":["plan.ts"],"tests":["plan.test.ts"],"envVars":["ALPACA_API_KEY","ALPACA_API_SECRET","SB_SECRET_KEY_CRON","SB_SECRET_KEY_INTERNAL","SUPABASE_URL"],"lines":566},"db":null,"declared":null,"drift":[],"annotation":"Modernised in 2caf9f8: all-or-nothing writes per league-week, with a completeness-based coverage gate that runs BEFORE any Alpaca call and skips on alreadyEndPriced / none_expected / complete, healing only the missing participants when coverage is partial.\n\nREAD THE 'will retry' LOG WITH SUSPICION. The ABORT path at index.ts:466 refuses a partial snapshot and logs '... refusing partial snapshot, will retry'. That promise has never been kept: schedule_snapshot_retry passes a TIMESTAMPTZ to cron.schedule, which has no such overload, so it raises on every call and no retry has ever been scheduled in this database. The all-or-nothing REFUSAL is live; its RECOVERY is not. An aborted league writes nothing and waits for the next Mon/Tue cron rather than re-attempting in 5 minutes. Fix drafted at supabase/migrations/20260727000000_fix_schedule_snapshot_retry_cron_expression.sql on branch fix/schedule-snapshot-retry-cron-expression — UNPUSHED as of 2026-07-27. Until it lands, treat that log line as an intention, not a guarantee.\n\nZERO WRITES IS OFTEN CORRECT. Paths producing no week_snapshots rows: :302 Monday holiday (early return, loop never runs), :324 no active matchup leagues, :357 no matchups for the league-week, :413 already_end_priced, :420 no_holdings, :425 already_complete. The two that indicate a PROBLEM are :466 (abort, unpriced symbols) and :494 (upsert error) — and both set anyIncomplete, which forces status 'retrying' (:516) or 'failed' (:530). So terminal status 'success' at :540 PROVES neither problem path fired. Zero rows plus 'success' means every league hit a benign skip.\n\nOne trap in that list: :302 depends on isMarketOpenToday, which returns open:false on a 401 (CLAUDE.md silent-failure #1). A stale Alpaca key therefore produces 'success' + zero rows + the log line 'Monday is a market holiday, skipping' on a day that is not a holiday.","verified":true,"id":"fn.snapshot-week-start","label":"snapshot-week-start","sublabel":"verify_jwt=false · apikey guard","kind":"edge-function","source":{"path":"supabase/functions/snapshot-week-start/index.ts","line":261}},{"layer":"edge","facts":{"verifyJwtSource":null,"authGuard":null,"localModules":[],"tests":[],"envVars":["SB_PUBLISHABLE_KEY","SUPABASE_URL"],"lines":41},"db":null,"declared":null," 0_migrate_snapshot_week_end_cron_auth.sql:84","supabase/migrations/20260618000001_migrate_snapshot_week_start_cron_auth.sql:59","supabase/migrations/20260727000000_fix_schedule_snapshot_retry_cron_expression.sql:69"],"latestDefinition":"supabase/migrations/20260727000000_fix_schedule_snapshot_retry_cron_expression.sql","redefinitions":4},"drift":[],"annotation":"FIXED and verified 2026-07-27. For its entire life until then it had never scheduled a retry: it declared retry_time TIMESTAMPTZ and passed it to cron.schedule, which has only (schedule text, command text) and (job_name text, schedule text, command text) overloads — and PostgreSQL removed implicit datetime->text casts in 8.3, so the call resolved to nothing and raised on every invocation.\n\nIt survived three migrations looking healthy because PL/pgSQL resolves called-function names at EXECUTION time, not at CREATE FUNCTION time — a migration applying cleanly says nothing about whether its function bodies work. And it left no trace because the INSERT INTO cron_job_status ... 'retrying' sits AFTER the PERFORM and a function body is atomic, so the raise rolled back its own evidence.\n\nThe fix passes a five-field cron expression formatted from the retry instant in cron.timezone. Proven live: calling it returned without error (it previously raised) and wrote a 'retrying' row — THE FIRST that table has ever held. That row is the evidence; before the fix the query for it could only ever return zero rows.\n\nNote the change is BEHAVIOR-ADDING. MAX_RETRIES is 3 in both callers and the initial run counts as attempt 1, so a failing run can now re-invoke its function up to 2 more times. For snapshot-week-start that is safe and useful — the coverage gate skips complete leagues and heals only missing participants. For snapshot-week-end it is safe but INEFFECTIVE: its existence-only alreadyProcessed guard skips a league as soon as ANY row carries a week_end_price, so a retry cannot heal a partial week-end write.","verifi :"e.fn.preview-league->pg.check_and_bump_rate_limit","detail":"Per-user and per-IP buckets. Fail-open by design — a limiter outage must not block joins.","files":["supabase/functions/preview-league/index.ts:31"]},{"n":3,"edge":"e.ui.join-league->fn.join-league","detail":"On confirm, the join is performed server-side. verify_jwt=true, so the caller identity is the gateway-verified JWT.","files":["apps/mobile/app/join-league.tsx:111"]},{"n":4,"edge":"e.fn.join-league->pg.check_and_bump_rate_limit","detail":"Same two buckets on the mutating path.","files":["supabase/functions/join-league/index.ts:31"]},{"n":5,"edge":"e.fn.join-league->pg.join_league_by_code","detail":"Atomic membership insert + invite accept. p_user_id comes from the verified JWT, never the request body. EXECUTE is service_role only, so the client cannot reach this directly.","files":["supabase/functions/join-league/index.ts:76"]},{"n":6,"edge":"e.pg.join_league_by_code->tbl.league_members#insert","detail":"Membership row written inside the function, so league_members stays unwritable by clients under RLS.","files":["supabase/migrations/20260716000000_preview_join_league_infra.sql:101"]},{"n":7,"edge":"e.pg.join_league_by_code->tbl.league_invites#update","detail":"Invite marked accepted in the same transaction as the insert — the pair is why this is an RPC rather than two client calls.","files":["supabase/migrations/20260716000000_preview_join_league_infra.sql:105"]}],"annotation":null,"unverified":[]},{"id":"flow.weekly-scoring","title":"Weekly scoring","trigger":{"kind":"cron","detail":"pg_cron `process-weekly-matchups` — Friday 21:15 UTC","cronJob":"process-weekly-matchups"},"nodePath":["cron.process-weekly-matchups","fn.process-week-results","tbl.cron_job_status","tbl.matchups","mod.process-week-results/grouping","tbl.week_snapshots","mod.process-week-results/scoring-eligibility","tbl.trades","tbl.drafts","ext.alpaca-data","tbl.league_standings","tbl.leagues","pg.complete_league_season"],"steps":[{"n":1,"edge":"e.cron.process-weekly-matchups->fn.process-week-results","detail":"net.http_post with an apikey header read from vault secret `cron_apikey`.","files":["supabase/migrations/20260618000000_migrate_process_week_results_cron_auth.sql:37"]},{"n":2,"edge":"e.fn.process-week-results->tbl.cron_job_status#upsert","detail":"Job marked running before any work.","files":["supabase/functions/process-week-results/index.ts:880"]},{"n":3,"edge":"e.fn.process-week-results->tbl.matchups","detail":"Pending matchups: team1_gain IS NULL, week_end in the past, league_type=matchup. The NULL filter is what makes a re-run idempotent.","files":["supabase/functions/process-week-results/index.ts:902"]},{"n":4,"edge":"e.fn.process-week-results->mod.process-week-results/grouping","detail":"One batch per (league_id, week_number), sorted week-ascending. Grouping by league alone was the original bug; the sort is load-bearing for week advancement.","files":["supabase/functions/process-week-results/index.ts:928","supabase/functions/process-week-results/grouping.ts:49"]},{"n":5,"edge":"e.fn.process-week-results->tbl.week_snapshots","detail":"Per batch. Presence of any row sets hasSnapshots; any week_end_price sets hasWeekEndPrices.","files":["supabase/functions/process-week-results/index.ts:949"]},{"n":6,"edge":"e.fn.process-week-results->mod.process-week-results/scoring-eligibility","detail":"GUARDS 1 & 2 — decideBatchScoring. A snapshot-less batch is skipped whole: stale_no_snapshots (>72h) or no_snapshots_week_gt_1. Freshness is checked first, and that order is load-bearing for ops labelling.","files":["supabase/functions/process-week-results/index.ts:1002","supabase/functions/process-week-results/scoring-eligibility.ts:108"]},{"n":7,"edge":"e.fn.process-week-results->tbl.trades","detail":"Mid-week trades inside [weekStart, weekEnd], then a second read bounded to week_end so a post-week sale cannot empty holdings and flip a win to an auto-loss.","files":["supabase/functions/process-week-results/index.ts:1048"]},{"n":8,"edge":"e.fn.process-week-results->tbl.drafts","detail":"Fallback scorer input — only reachable at week 1.","files":["supabase/functions/process-week-results/index.ts:1072"]},{"n":9,"edge":"e.fn.process-week-results->ext.alpaca-data","detail":"Latest quotes, IEX feed. Failures are swallowed into an empty price map rather than throwing.","files":["supabase/functions/process-week-results/index.ts:154"]},{"n":10,"edge":"e.fn.process-week-results->mod.process-week-results/scoring-eligibility","detail":"GUARD 3a — decideUserScorer picks full | legacy | fallback | unscoreable per user. A snapshot-less user past week 1 is unscoreable: cumulative-from-entry is all-time P/L, not a weekly delta.","files":["supabase/functions/process-week-results/index.ts:1125","supabase/functions/process-week-results/scoring-eligibility.ts:146"]},{"n":11,"edge":"e.fn.process-week-results->mod.process-week-results/scoring-eligibility","detail":"GUARD 3b — decideMatchupScoring refuses any matchup containing an unscoreable participant. Byes gate on team1 only. Refused matchups keep team1_gain NULL and stay pending.","files":["supabase/functions/process-week-results/index.ts:1174","supabase/functions/process-week-results/scoring-eligibility.ts:171"]},{"n":12,"edge":"e.fn.process-week-results->tbl.matchups#update","detail":"Winner written: bye = auto-win, empty portfolio = auto-loss, else dollar gain, tiebreak percent then playoff seed.","files":["supabase/functions/process-week-results/index.ts:1284"]},{"n":13,"edge":"e.fn.process-week-results->tbl.league_standings#update","detail":"Read-then-increment, not transactional and NOT reversible. This irreversibility is the entire reason guards 1-3 refuse rather than fabricate.","files":["supabase/functions/process-week-results/index.ts:1329"]},{"n":14,"edge":"e.fn.process-week-results->tbl.leagues#update","detail":"current_week re-read per batch and advanced only when the batch IS the current week — so a guard-skipped week blocks advancement instead of being stepped over.","files":["supabase/functions/process-week-results/index.ts:1426"]},{"n":15,"edge":"e.fn.process-week-results->pg.complete_league_season","detail":"Season end, from playoffs finals or from standings when playoff_teams = 0.","files":["supabase/functions/process-week-results/index.ts:783"]}],"annotation":"The most defensive path in the codebase, and the reason it is defensive is that league_standings increments are irreversible. There is no transaction around the read-then-increment and no compensating write, so a fabricated score cannot be undone by re-running. Three guards therefore refuse rather than guess. Read them in order: decideBatchScoring kills a whole snapshot-less league-week; decideUserScorer marks an individual snapshot-less user unscoreable past week 1; decideMatchupScoring refuses any matchup containing one. All three exist because the fallback scorer returns cumulative-from-draft-entry P/L, which is only a valid weekly delta in week 1.","unverified":[]},{"id":"flow.week-start-snapshot","title":"Week-start snapshot","trigger":{"kind":"cron","detail":"pg_cron `snapshot-week-start` — Mon+Tue 14:35 UTC","cronJob":"snapshot-week-start"},"nodePath":["cron.snapshot-week-start","fn.snapshot-week-start","mod.snapshot-week-start/plan","ext.alpaca-data","tbl.week_snapshots","pg.schedule_snapshot_retry"],"steps":[{"n":1,"edge":"e.cron.snapshot-week-start->fn.snapshot-week-start","detail":"net.http_post with apikey from vault `cron_apikey`.","files":["supabase/migrations/20260618000001_migrate_snapshot_week_start_cron_auth.sql:35"]},{"n":2,"edge":"e.fn.snapshot-week-start->mod.snapshot-week-start/plan","detail":"Pure planning module — decides which league-weeks need snapshotting and what to fetch.","files":["supabase/functions/snapshot-week-start/plan.ts:95"]},{"n":3,"edge":"e.fn.snapshot-week-start->ext.alpaca-data","detail":"Historical bars for week-start prices.","files":["supabase/functions/snapshot-week-start/index.ts:29"]},{"n":4,"edge":"e.fn.snapshot-week-start->tbl.week_snapshots","detail":"ALL-OR-NOTHING per league-week with completeness-based skip (fixed in 2caf9f8). A partial price fetch writes nothing rather than a half-week.","files":["supabase/functions/snapshot-week-start/index.ts:397"]},{"n":5,"edge":"e.fn.snapshot-week-start->pg.schedule_snapshot_retry","detail":"Retry scheduling, shared with snapshot-week-end.","files":["supabase/functions/snapshot-week-start/index.ts:135"]}],"annotation":null,"unverified":[]},{"id":"flow.week-end-snapshot","title":"Week-end snapshot","trigger":{"kind":"cron","detail":"pg_cron `snapshot-week-end` — Friday 21:05 UTC, 10 min before scoring","cronJob":"snapshot-week-end"},"nodePath":["cron.snapshot-week-end","fn.snapshot-week-end","ext.alpaca-data","tbl.week_snapshots","pg.schedule_snapshot_retry"],"steps":[{"n":1,"edge":"e.cron.snapshot-week-end->fn.snapshot-week-end","detail":"net.http_post with apikey from vault `cron_apikey`. Runs 10 minutes before process-weekly-matchups — that gap is the entire budget for writing week_end_price before scoring reads it.","files":["supabase/migrations/20260612000000_migrate_snapshot_week_end_cron_auth.sql:34"]},{"n":2,"edge":"e.fn.snapshot-week-end->ext.alpaca-data","detail":"Friday close prices.","files":["supabase/functions/snapshot-week-end/index.ts:22"]},{"n":3,"edge":"e.fn.snapshot-week-end->tbl.week_snapshots#update","detail":"Writes week_end_price onto existing rows. NOTE: unlike snapshot-week-start this has no extracted plan module and no unit tests — see the comparison annotation.","files":["supabase/functions/snapshot-week-end/index.ts:299"]},{"n":4,"edge":"e.fn.snapshot-week-end->tbl.week_snapshots","detail":"Mid-week purchases: positions with no week-start row get one here, carrying a real weighted-average entry price and entered_mid_week = true. This insert had NEVER succeeded before 2026-07-27 — it wrote week_start_price: null against a NOT NULL column, so every mid-week position was silently dropped from scoring. The flag is what stops the row being double-counted as a Monday holding.","files":["supabase/functions/snapshot-week-end/index.ts:299"]},{"n":5,"edge":"e.fn.snapshot-week-end->pg.schedule_snapshot_retry","detail":"Shared retry path.","files":["supabase/functions/snapshot-week-end/index.ts:100"]}],"annotation":"Read this against flow.week-start-snapshot. The asymmetry USED to be that week-end had no extracted module, no tests and an unaudited write path; that was closed on 2026-07-28 (see fn.snapshot-week-end). Both now have a pure decision module with hermetic tests, a completeness-based coverage gate that runs before any Alpaca call, and all-or-nothing per-league writes.\n\nThe REMAINING asymmetry is intrinsic and load-bearing, not debt: week-start inserts one row per holding, while week-end must both CLOSE existing Monday rows and INSERT mid-week buys. That is why close.ts models two kinds of 'missing' where plan.ts models one. Do not refactor them into a shared module on the assumption they are the same shape — they are not.\n\nTiming still matters: week-end runs only ten minutes before scoring, so an aborted league has little room to be healed by a retry before process-week-results reads the same rows. The downstream per-user gate (decideUserScorer -> 'unscoreable') remains the required backstop.","unverified":["step 4: anchor not found — supabase/functions/snapshot-week-end/index.ts no longer contains \"entered_mid_week: true\"","step 4: anchor not found — supabase/functions/snapshot-week-end/index.ts no longer contains \"function midWeekEntryPrice\""]},{"id":"flow.place-trade","title":"Place a trade","trigger":{"kind":"user","detail":"User confirms a buy or sell in TradeModal"},"nodePath":["ui.TradeModal","fn.quote","fn.place-order","tbl.broker_credentials","ext.alpaca-trading","tbl.trades"],"steps":[{"n":1,"edge":"e.ui.TradeModal->fn.quote","detail":"Live quote for the symbol before confirming.","files":["apps/mobile/components/TradeModal.tsx:121"]},{"n":2,"edge":"e.ui.TradeModal->fn.place-order","detail":"Order submitted server-side so broker credentials never reach the client.","files":["apps/mobile/components/TradeModal.tsx:333"]},{"n":3,"edge":"e.fn.place-order->tbl.broker_credentials","detail":"Per-user Alpaca keys read server-side.","files":["supabase/functions/place-order/index.ts:48"]},{"n":4,"edge":"e.fn.place-order->ext.alpaca-trading","detail":"Order placed against the user's own Alpaca account. place-order does NOT touch the trades table — it returns the Alpaca order to the client.","files":["supabase/functions/place-order/index.ts:51"]},{"n":5,"edge":"e.ui.TradeModal->tbl.trades#insert","detail":"The trade row is written by the CLIENT after place-order returns — not server-side. So the DB record and the real Alpaca order are committed by two different actors with no transaction between them: if the app dies in this gap the order exists at the broker and not in the DB. That gap is why order reconciliation exists.","files":["apps/mobile/components/TradeModal.tsx:386"]}],"annotation":"The trade row is written by the client, not by place-order. place-order reads broker_credentials, submits to Alpaca, and returns; TradeModal then inserts into trades. The broker order and the database record are committed by two different actors with nothing linking them transactionally, so a crash, network drop, or backgrounded app between the two leaves a real position at Alpaca with no row in the DB. flow.order-reconciliation exists to close that window after the fact.\n\nPARTIAL SALES READ AS A BUG BUT ARE NOT ONE. If a position is partly sold during the week, the matchup and dashboard screens show UNREALIZED P/L on the quantity still held at week end, while the scorer additionally settles the REALIZED P/L of the sold portion from midWeekTrades. So a screen and a standings number can legitimately differ after a partial sale, and the screen will read low. This is pre-existing and symmetrical: week-start holdings behave the same way, because their snapshot quantity is Monday's and the UI never consults trades. Not a defect — but it is the first thing a user will report, so recognise it rather than re-investigating.","unverified":[]},{"id":"flow.order-reconciliation","title":"Order reconciliation","trigger":{"kind":"cron","detail":"pg_cron `sync-alpaca-orders` — weekdays 21:30 UTC","cronJob":"sync-alpaca-orders"},"nodePath":["cron.sync-alpaca-orders","fn.sync-alpaca-orders","tbl.broker_credentials","ext.alpaca-trading","tbl.trades"],"steps":[{"n":1,"edge":"e.cron.sync-alpaca-orders->fn.sync-alpaca-orders","detail":"net.http_post with apikey from vault, body {\"mode\":\"sync-all\"}. This function was a verify_jwt true->false FLIP — its in-code apikey guard is now its ONLY protection.","files":["supabase/migrations/20260618000002_migrate_sync_alpaca_orders_cron_auth.sql:34"]},{"n":2,"edge":"e.fn.sync-alpaca-orders->tbl.broker_credentials","detail":"Per-user keys to query each account.","files":["supabase/functions/sync-alpaca-orders/index.ts:85"]},{"n":3,"edge":"e.fn.sync-alpaca-orders->ext.alpaca-trading","detail":"Fetch fills and order status.","files":["supabase/functions/sync-alpaca-orders/index.ts:88"]},{"n":4,"edge":"e.fn.sync-alpaca-orders->tbl.trades#update","detail":"Reconcile recorded trades against actual fills — closes the loop on Place a trade.","files":["supabase/functions/sync-alpaca-orders/index.ts:153"]}],"annotation":null,"unverified":[]},{"id":"flow.draft-stock","title":"Draft a stock","trigger":{"kind":"user","detail":"User makes a pick on the draft screen"},"nodePath":["ui.draft","fn.quote","tbl.drafts"],"steps":[{"n":1,"edge":"e.ui.draft->fn.quote","detail":"Price lookup for the pick.","files":["apps/mobile/app/(tabs)/draft.tsx:191"]},{"n":2,"edge":"e.ui.draft->tbl.drafts#insert","detail":"Pick written directly from the client under RLS — no edge function in this path.","files":["apps/mobile/app/(tabs)/draft.tsx:109"]}],"annotation":null,"unverified":[]},{"id":"flow.season-reset","title":"Season reset","trigger":{"kind":"user","detail":"Commissioner taps reset in league settings"},"nodePath":["ui.league-settings","pg.start_new_league_season","tbl.leagues","tbl.league_seasons","tbl.league_standings","tbl.matchups"],"steps":[{"n":1,"edge":"e.ui.league-settings->pg.start_new_league_season","detail":"Called directly from the client as an authenticated user. EXECUTE is granted to `authenticated`, so the authorization is NOT the grant — it is an INTERNAL commissioner check inside the function body. That gate is the only thing standing between any league member and the four destructive writes below.","files":["apps/mobile/app/league-settings.tsx:125"]},{"n":2,"edge":"e.pg.start_new_league_season->tbl.leagues","detail":"GATE 1 — commissioner check: `commissioner_id = auth.uid()::text`. auth.uid() is NULL for anon, so it fails closed. Checked BEFORE the state guard so an unauthorized caller learns nothing about league state.","files":["supabase/migrations/20260718000000_lockdown_start_new_league_season.sql:58"]},{"n":3,"edge":"e.pg.start_new_league_season->tbl.league_seasons#insert","detail":"WRITE 1 — new league_seasons row at MAX(season_number)+1. This is what preserves the old season, so it must succeed before anything is destroyed.","files":["supabase/migrations/20260718000000_lockdown_start_new_league_season.sql:75"]},{"n":4,"edge":"e.pg.start_new_league_season->tbl.league_standings#update","detail":"WRITE 2 — every standings row for the league zeroed: wins, losses, ties, points_for, points_against.","files":["supabase/migrations/20260718000000_lockdown_start_new_league_season.sql:80"]},{"n":5,"edge":"e.pg.start_new_league_season->tbl.matchups#delete","detail":"WRITE 3 — DESTRUCTIVE: every matchup for the league is deleted outright. History survives only via league_seasons.final_standings, so if WRITE 1 did not capture it, it is gone.","files":["supabase/migrations/20260718000000_lockdown_start_new_league_season.sql:85"]},{"n":6,"edge":"e.pg.start_new_league_season->tbl.leagues#update","detail":"WRITE 4 — league pointed at the new season: current_season_id, season_status=active, current_week=1. All four writes share one implicit transaction, so a failure rolls back the whole reset.","files":["supabase/migrations/20260718000000_lockdown_start_new_league_season.sql:91"]}],"annotation":"The only flow where a destructive operation is authorized entirely inside a function body. EXECUTE on start_new_league_season is granted to `authenticated`, so any logged-in user can call it with any league id. Nothing in the grant layer stops a non-commissioner from resetting someone else's league — the internal commissioner check is the whole control. That is deliberate (the client calls it directly, so it must be authenticated-callable), but it means the gate has to be correct, with no defence in depth if it regresses.","unverified":[]},{"id":"flow.quote-fanout","title":"Quote / symbol fan-out","trigger":{"kind":"user","detail":"Any screen needing prices, names, or search"},"nodePath":["ui.draft","fn.quote","ui.matchup","ui.profile","ui.TradeModal","ui.src.components.TradeModal.jsx","ui.src.context.PriceContext.jsx","ui.src.pages.DraftPage.jsx","ui.src.pages.Profile.jsx","ui.useStockPrices","fn.ticker-quotes","ui.src.Ticker.jsx","fn.symbol-name","ui.useStockNames","fn.symbols-search","ui.src.components.DraftControls.jsx","ui.useHistoricalPL","fn.historical-bars"],"steps":[{"n":1,"edge":["e.ui.draft->fn.quote","e.ui.matchup->fn.quote","e.ui.profile->fn.quote","e.ui.TradeModal->fn.quote","e.ui.src.components.TradeModal.jsx->fn.quote","e.ui.src.context.PriceContext.jsx->fn.quote","e.ui.src.pages.DraftPage.jsx->fn.quote","e.ui.src.pages.Profile.jsx->fn.quote"],"detail":"quote — single-symbol live price. The most-invoked function in the app.","files":["apps/mobile/app/(tabs)/draft.tsx:191","apps/mobile/app/(tabs)/matchup.tsx:339","apps/mobile/app/(tabs)/matchup.tsx:423","a <script>
(function () {
  const D = JSON.parse(document.getElementById('arch-data').textContent);
  const byId = new Map(D.nodes.map(n => [n.id, n]));
  const edgeById = new Map(D.edges.map(e => [e.id, e]));
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- provenance ----------
  el('m-commit').textContent = D.generated.commitShort + ' (' + D.generated.branch + ')';
  el('m-gen').textContent = D.generated.timestamp.replace('T', ' ').replace('Z', ' UTC');
  el('m-hash').textContent = D.generated.sourceHash.replace('sha256:', '').slice(0, 12);
  // The dirty badge names the files, because "dirty tree" alone tells you nothing you
  // can act on. It counts only sources this map is derived from (plus the generator) —
  // never the generated output, which is dirty by definition on every regeneration.
  const dirty = el('m-dirty');
  const dp = D.generated.dirtyPaths || [];
  if (dp.length) {
    dirty.textContent = dp.length + ' source' + (dp.length > 1 ? 's' : '') + ' uncommitted at build';
    dirty.className = 'pill med btn';
    dirty.title = 'Click for the list';
    dirty.addEventListener('click', () => openDrawer(
      'Uncommitted at build time',
      'commit <code>' + esc(D.generated.commitShort) + '</code> does not fully describe this map',
      '<p class="lede">These files the map reads had uncommitted changes when it was generated, so the commit above does not identify everything you are looking at. If they were committed afterwards, regenerate to clear this.</p>' +
      '<ul>' + dp.map(f => '<li style="margin:5px 0"><code>' + esc(f.path) + '</code> <span class="proto">' + esc(f.code || '?') + '</span></li>').join('') + '</ul>' +
      '<h3>Why the commit is the parent</h3><p class="lede">' + esc(D.generated.commitMeaning || '') + '</p>'));
  } else dirty.remove();

  const db = D.dbSnapshot, dbPill = el('m-db');
  if (!db.present) { dbPill.textContent = 'NO DB SNAPSHOT'; dbPill.className = 'pill high'; }
  else {
    const d = db.ageDays;
    dbPill.textContent = 'db snapshot ' + (d < 1 ? Math.max(1, Math.round(db.ageHours)) + 'h old' : d + 'd old');
    dbPill.className = 'pill ' + (db.stale ? 'high' : d > db.staleAfterDays / 2 ? 'med' : 'ok');
    dbPill.title = 'Captured ' + db.capturedAt + ' · stale after ' + db.staleAfterDays + ' days';
  }

  // ---------- loud banners (collapsible so they never bury the graph) ----------
  const high = D.drift.filter(r => r.severity === 'high');
  const banners = [];
  if (!db.present) banners.push({ cls: 'stale', open: true,
    h: 'This map does not know anything about the database.',
    body: '<p>No <code>docs/architecture/db-snapshot.json</code>. Every function ACL, search_path pin, RLS policy and cron job below is <b>unknown</b> — not verified-absent. Run <code>docs/architecture/db-snapshot.sql</code> against prod and save the output.</p>' });
  else if (db.stale) banners.push({ cls: 'stale', open: true,
    h: 'Database snapshot is ' + db.ageDays + ' days old.',
    body: '<p>Past the ' + db.staleAfterDays + '-day limit. Grants, policies and cron schedules below may no longer match prod.</p>' });

  if (high.length) banners.push({ cls: 'stale', open: true,
    h: high.length + ' high-severity claim-vs-reality mismatch' + (high.length > 1 ? 'es' : ''),
    body: '<ul>' + high.map(r => '<li><b>' + esc(r.label) + '</b> — ' + esc(r.note) +
      '<div class="why">migration says: <code>' + esc(r.declared) + '</code><br>database says: <code>' + esc(r.live) + '</code></div></li>').join('') + '</ul>' });

  if (D.unverified.length) banners.push({ cls: 'warn', open: false,
    h: D.unverified.length + ' thing' + (D.unverified.length > 1 ? 's' : '') + ' this map could NOT verify',
    body: '<ul>' + D.unverified.map(u => '<li><b>' + esc(u.scope) + '</b> — ' + esc(u.claim) +
      '<div class="why">' + esc(u.reason) + '<br>resolve: <code>' + esc(u.resolve) + '</code></div></li>').join('') + '</ul>' });

  el('banners').innerHTML = banners.map(b =>
    '<div class="banner ' + b.cls + '"><details' + (b.open ? ' open' : '') +
    '><summary><h2>' + esc(b.h) + '</h2></summary>' + b.body + '</details></div>').join('');

  // ---------- columns ----------
  const driftByNode = new Map();
  for (const r of D.drift) { if (!driftByNode.has(r.node)) driftByNode.set(r.node, []); driftByNode.get(r.node).push(r); }

  el('columns').innerHTML = D.layers.map(L => {
    const ns = D.nodes.filter(n => n.layer === L.id);
    return '<div class="col" data-layer="' + L.id + '"><h3>' + esc(L.label) + ' · ' + ns.length + '</h3>' +
      ns.map(n => {
        const dr = driftByNode.get(n.id) || [];
        const worst = dr.some(d => d.severity === 'high') ? 'high' : dr.some(d => d.severity === 'medium') ? 'med' : dr.length ? 'low' : null;
        const flags = [];
        if (worst) flags.push('<span class="flag ' + worst + '">drift ' + dr.length + '</span>');
        if (!n.verified) flags.push('<span class="flag unv">unverified</span>');
        if (n.annotation) flags.push('<span class="flag note">note</span>');
        return '<div class="node" data-layer="' + L.id + '" data-id="' + esc(n.id) + '">' +
          '<div class="lbl">' + esc(n.label) + '</div>' +
          (n.sublabel ? '<div class="sub">' + esc(n.sublabel) + '</div>' : '') +
          (flags.length ? '<div class="flags">' + flags.join('') + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  }).join('');

  // ---------- state ----------
  let currentFlow = null, hideOff = false, activeStep = null;
  const nodeEl = (id) => document.querySelector('.node[data-id="' + CSS.escape(id) + '"]');

  function edgesOfStep(s) { return (Array.isArray(s.edge) ? s.edge : [s.edge]).map(id => edgeById.get(id)).filter(Boolean); }

  function drawWires() {
    const svg = el('wires');
    svg.innerHTML = '';
    if (!currentFlow) return;
    const wrap = el('graphwrap');
    const wr = wrap.getBoundingClientRect();
    const ox = wr.left - wrap.scrollLeft;
    const oy = wr.top - wrap.scrollTop;
    const NS = 'http://www.w3.org/2000/svg';
    for (const step of currentFlow.steps) {
      const focused = activeStep === null || activeStep === step.n;
      for (const e of edgesOfStep(step)) {
        const a = nodeEl(e.from), b = nodeEl(e.to);
        if (!a || !b || a.classList.contains('hidden') || b.classList.contains('hidden')) continue;
        const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        const x1 = ra.right - ox, y1 = ra.top + ra.height / 2 - oy;
        const x2 = rb.left - ox,  y2 = rb.top + rb.height / 2 - oy;
        const mx = (x1 + x2) / 2;
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
        p.setAttribute('opacity', focused ? '.85' : '.12');
        svg.appendChild(p);
        if (!focused) continue;
        // Stagger badges along the curve: one source often fans out to many targets,
        // so every curve shares a midpoint x and the numbers would stack into a pile.
        const t = 0.34 + ((step.n - 1) % 5) * 0.11, u = 1 - t;
        const bez = (P0, P1, P2, P3) => u*u*u*P0 + 3*u*u*t*P1 + 3*u*t*t*P2 + t*t*t*P3;
        const bx = bez(x1, mx, mx, x2), by = bez(y1, y1, y2, y2);
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', 9);
        svg.appendChild(c);
        const tx = document.createElementNS(NS, 'text');
        tx.setAttribute('x', bx); tx.setAttribute('y', by + 3.5); tx.textContent = step.n;
        svg.appendChild(tx);
      }
    }
  }

  function paintNodes() {
    const inPath = new Set(currentFlow ? currentFlow.nodePath : []);
    const stepOf = new Map();
    if (currentFlow) for (const s of currentFlow.steps) for (const e of edgesOfStep(s)) if (!stepOf.has(e.to)) stepOf.set(e.to, s.n);
    document.querySelectorAll('.node').forEach(nd => {
      const on = currentFlow && inPath.has(nd.dataset.id);
      nd.classList.toggle('on', !!on);
      nd.classList.toggle('dim', !!currentFlow && !on && !hideOff);
      nd.classList.toggle('hidden', !!currentFlow && !on && hideOff);
      const sn = on ? stepOf.get(nd.dataset.id) : null;
      nd.classList.toggle('step', sn != null);
      if (sn != null) nd.dataset.step = sn; else delete nd.dataset.step;
    });
  }

  function renderRail() {
    const head = el('railhead'), body = el('railbody');
    if (!currentFlow) {
      head.innerHTML = '<h3>Flows</h3>';
      body.innerHTML = D.flows.map(f =>
        '<div class="flow" data-id="' + esc(f.id) + '"><div class="t">' + esc(f.title) + '</div>' +
        '<div class="tr">' + esc(f.trigger.kind) + ' · ' + f.steps.length + ' steps</div></div>').join('');
      return;
    }
    head.innerHTML = '<button class="back" id="backbtn">&larr; All flows</button>' +
      '<div class="ftitle">' + esc(currentFlow.title) + '</div>' +
      '<div class="ftrig">' + esc(currentFlow.trigger.detail) + '</div>';
    body.innerHTML = (currentFlow.annotation ? '<div class="anno">' + esc(currentFlow.annotation) + '</div>' : '') +
      '<ol class="steps">' + currentFlow.steps.map(s => {
        const e = edgesOfStep(s)[0];
        const path = e ? (byId.get(e.from)?.label || e.from) + ' → ' + (byId.get(e.to)?.label || e.to) : String(s.edge);
        return '<li data-step="' + s.n + '"' + (activeStep === s.n ? ' class="on"' : '') + '>' +
          '<div class="num">' + s.n + '</div><div class="stepbody">' +
          '<div class="path">' + esc(path) + (e ? '<span class="proto">' + esc(e.protocol) + '</span>' : '') + '</div>' +
          '<div class="det">' + esc(s.detail) + '</div>' +
          (e && e.annotation ? '<div class="anno" style="margin:7px 0 0">' + esc(e.annotation) + '</div>' : '') +
          (s.files && s.files.length ? '<div class="cites">' + s.files.map(f => '<span class="cite">' + esc(f) + '</span>').join('') + '</div>' : '') +
          '</div></li>';
      }).join('') + '</ol>';
  }

  function selectFlow(flow) {
    currentFlow = flow; activeStep = null;
    renderRail(); paintNodes();
    requestAnimationFrame(drawWires);
  }

  // ---------- rail interactions (no viewport movement anywhere) ----------
  el('railbody').addEventListener('click', ev => {
    const f = ev.target.closest('.flow');
    if (f) { selectFlow(D.flows.find(x => x.id === f.dataset.id)); return; }
    const li = ev.target.closest('li[data-step]');
    if (li) {
      const n = +li.dataset.step;
      activeStep = activeStep === n ? null : n;
      renderRail(); drawWires();
    }
  });
  el('railhead').addEventListener('click', ev => { if (ev.target.id === 'backbtn') selectFlow(null); });
  el('clearflow').addEventListener('click', () => selectFlow(null));
  el('hidetoggle').addEventListener('click', ev => {
    hideOff = !hideOff;
    ev.target.textContent = hideOff ? 'Show all' : 'Hide off-path';
    paintNodes(); requestAnimationFrame(drawWires);
  });

  // ---------- drawer ----------
  function openDrawer(title, sub, html) {
    el('d-title').textContent = title;
    el('d-sub').innerHTML = sub;
    el('d-body').innerHTML = html;
    el('drawer').classList.add('open');
    el('scrim').classList.add('open');
  }
  function closeDrawer() { el('drawer').classList.remove('open'); el('scrim').classList.remove('open'); }
  el('d-close').addEventListener('click', closeDrawer);
  el('scrim').addEventListener('click', closeDrawer);
  addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDrawer(); });

  const driftCard = (r, withObj) =>
    '<div class="dcard ' + r.severity + '">' + (withObj ? '<div class="obj">' + esc(r.label) + ' · ' + esc(r.field) + '</div>' : '') +
    '<span class="says"><b>migration says:</b> ' + esc(r.declared) + '</span>' +
    '<span class="says"><b>database says:</b> ' + esc(r.live) + '</span>' +
    '<div class="why">' + esc(r.note) + '</div></div>';

  // Findings that repeat across many objects collapse into ONE row with the affected
  // list behind a disclosure. A panel where 11 of 15 rows restate one observation
  // teaches the reader to skip it, which costs more than the detail is worth.
  el('driftbtn').addEventListener('click', () => {
    const groups = new Map();
    for (const r of D.drift) {
      const k = r.groupKey || r.field;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    const sev = { high: 0, medium: 1, low: 2 };
    const ordered = [...groups.values()].sort((a, b) => sev[a[0].severity] - sev[b[0].severity] || b.length - a.length);
    const html = ordered.map(rows => rows.length === 1 ? driftCard(rows[0], true) :
      '<div class="dcard ' + rows[0].severity + '">' +
      '<div class="obj">' + esc(rows[0].field) + ' — ' + rows.length + ' objects</div>' +
      '<div class="why">' + esc(rows[0].note) + '</div>' +
      '<details style="margin-top:8px"><summary>' + rows.map(r => esc(r.label)).join(', ') + '</summary>' +
      rows.map(r => '<div style="margin:8px 0 0"><span class="says"><b>' + esc(r.label) + ':</b> ' + esc(r.live) + '</span></div>').join('') +
      '</details></div>').join('');
    openDrawer('Claim vs reality',
      D.drift.length + ' findings in ' + ordered.length + ' groups · ' + high.length + ' high severity',
      '<p class="lede">Every place the repo\'s migrations disagree with what prod actually has. Migration text is a claim; <code>db-snapshot.json</code> is the evidence. <code>REVOKE … FROM PUBLIC</code> does not clear Supabase\'s default <code>anon</code>/<code>authenticated</code> grants, and <code>CREATE OR REPLACE FUNCTION</code> does not reset privileges — so "the migration says it is locked down" is never evidence that it is.</p>' + html);
  });

  el('deadbtn').addEventListener('click', () => {
    const dc = D.deadCode || [];
    openDrawer('Nothing calls these', dc.length + ' nodes with zero inbound edges',
      '<p class="lede">Reachable by nothing in the scanned surface. Triggers, client screens and external services are excluded — those are entry points, so an inbound count says nothing about them. Treat this as a cleanup worklist, not a proof: a dynamically-built invoke or dynamic SQL would not be seen.</p>' +
      (dc.length ? dc.map(n => '<div class="dcard low"><div class="obj">' + esc(n.label) + ' <span class="proto">' + esc(n.kind) + '</span></div>' +
        (n.source ? '<span class="says">' + esc(n.source) + '</span>' : '') +
        (n.outbound.length ? '<div class="why">still reaches: ' + n.outbound.map(o => '<code>' + esc(o) + '</code>').join(', ') + '</div>' : '') +
        '<div class="why">' + esc(n.caveat) + '</div></div>').join('') : '<p>Nothing unreachable.</p>'));
  });

  el('columns').addEventListener('click', ev => {
    const nd = ev.target.closest('.node'); if (!nd) return;
    const n = byId.get(nd.dataset.id); if (!n) return;
    const parts = [];
    if (n.annotation) parts.push('<div class="anno">' + esc(n.annotation) + '</div>');
    const dr = driftByNode.get(n.id) || [];
    if (dr.length) parts.push('<h3>Claim vs reality</h3>' + dr.map(r => driftCard(r, false)).join(''));
    const pre = (t, o) => '<h3>' + t + '</h3><pre class="mono">' + esc(JSON.stringify(o, null, 2)) + '</pre>';
    if (n.db) parts.push(pre('Live database facts', n.db));
    if (n.declared) parts.push(pre('Declared by migrations', n.declared));
    if (n.facts && Object.keys(n.facts).length) parts.push(pre('Derived from files', n.facts));
    // Columns are shown inline: on a table like broker_credentials the difference
    // between select('key_id') and select('*') is the entire security question.
    const list = (es, dir) => es.length ? '<h3>' + dir + ' (' + es.length + ')</h3><ul>' + es.map(e =>
      '<li style="margin:5px 0"><code>' + esc(dir === 'Inbound' ? e.from : e.to) + '</code><span class="proto">' + esc(e.protocol) + '</span>' +
      (e.derivedFrom === 'sql-body' ? '<span class="proto">from SQL body</span>' : '') +
      (e.columns && e.columns.length
        ? '<div class="why" style="font-size:11.5px">columns: ' + e.columns.map(c =>
            '<code' + (c === '*' ? ' style="color:var(--high);font-weight:700"' : '') + '>' + esc(c) + '</code>').join(' · ') + '</div>'
        : '') +
      '<div class="cites">' + e.callSites.map(c => '<span class="cite">' + esc(c) + '</span>').join('') + '</div></li>').join('') + '</ul>' : '';
    parts.push(list(D.edges.filter(e => e.to === n.id), 'Inbound'));
    parts.push(list(D.edges.filter(e => e.from === n.id), 'Outbound'));
    openDrawer(n.label, '<code>' + esc(n.id) + '</code> · ' + esc(n.kind) +
      (n.source ? ' · <code>' + esc(n.source.path) + ':' + n.source.line + '</code>' : ''), parts.join(''));
  });

  // ---------- theme ----------
  el('themebtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    requestAnimationFrame(drawWires);
  });

  addEventListener('resize', drawWires);
  el('graphwrap').addEventListener('scroll', drawWires);
  el('banners').addEventListener('toggle', () => requestAnimationFrame(drawWires), true);

  renderRail();
})();
</script>
</body>
</html>
