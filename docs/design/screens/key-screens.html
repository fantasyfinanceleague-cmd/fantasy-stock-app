   On :root (NOT scoped to a class) — but this file is imported only by

<style>
/* One design, two themes (Giorgio, 2026-09-29). Supersedes the money/game
   surface axis: every screen is entirely Light or entirely Dark; nothing
   inverts inside a screen. Same semantic names, two values each. Scoreboards
   get emphasis from type scale, motion and accent, not from a dark card.

   Naming: --c-<role>. "*-text" variants are the text-safe (≥4.5:1) cut of a
   colour whose fill value is too light or too loud for text. Contrast for
   every pair is computed live on the board (the token table). */

[data-ks-theme='light'] {
  color-scheme: light;
  --c-bg: #F3F5F8;
  --c-surface: #FFFFFF;
  --c-inset: #F0F3F7;
  --c-sunken: #EBEFF4;
  --c-line: #E3E8EF;

<style>
/* Key screens: the app's real screens as web components (Design Lead,
   2026-09-29). Every value comes from tokens.css (--sp-*, DESIGN_DIRECTION
   §9). Device geometry is iPhone 18 Pro class: 402 × 874 pt, a 54pt status
   area with the Dynamic Island, and an 83pt tab bar including the 34pt
   home indicator. Class prefix: ks- (landing port: rename to lp-/sp-). */

.ks-device {
  position: relative;
  width: 402px;
  height: 874px;
  border-radius: 56px;
  overflow: hidden;
  background: var(--c-bg);
  font-family: var(--sp-type-family);
  color: var(--c-text);
  font-size: var(--sp-type-body-size);
  line-height: var(--sp-type-body-line);
  -webkit-font-smoothing: antialiased;
  isolation: isolate;
}
/* No second surface: `game` devices look like every other device. */
.ks-device { background: var(--c-bg); color: var(--c-text); }

/* ── OS chrome ─────────────────────────────────────────────────────────── */
.ks-os {
  position: absolute; inset: 0 0 auto 0; height: 54px; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 34px 0 46px; font-weight: 600; font-size: 17px;
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.ks-os__island { position: absolute; left: 50%; top: 11px; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; }
.ks-os__icons { display: flex; gap: 6px; align-items: center; }
.ks-os__bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
.ks-os__bars i { width: 3px; background: currentColor; border-radius: 1px; }
.ks-os__bars i:nth-child(1) { height: 4px; } .ks-os__bars i:nth-child(2) { height: 6px; }
.ks-os__bars i:nth-child(3) { height: 9px; } .ks-os__bars i:nth-child(4) { height: 12px; }
.ks-os__batt { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1.5px; opacity: .9; }
.ks-os__batt i { display: block; height: 100%; width: 70%; background: currentColor; border-radius: 1.5px; }

.ks-scroll { position: absolute; inset: 54px 0 83px 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.ks-scroll::-webkit-scrollbar { display: none; }
.ks-pad { padding: 0 var(--sp-space-5); }
.ks-stack { display: flex; flex-direction: column; gap: var(--sp-space-5); padding-bottom: var(--sp-space-7); }

.ks-tabs {
  position: absolute; inset: auto 0 0 0; height: 83px; z-index: 5;
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px 8px 0;
  background: var(--c-tabbar); backdrop-filter: blur(20px);
  border-top: 1px solid var(--c-border);
}
.ks-tabs__t { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--c-text-2); font-size: 10.5px; font-weight: 600; }
.ks-tabs__t svg { width: 26px; height: 26px; }
.ks-tabs__t--on { color: var(--c-accent); }
.ks-home-ind { position: absolute; left: 50%; bottom: 8px; width: 139px; height: 5px; margin-left: -69.5px; border-radius: 3px; background: var(--c-text); z-index: 6; }

/* ── Headers ───────────────────────────────────────────────────────────── */
.ks-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-space-3); padding: var(--sp-space-3) var(--sp-space-5) var(--sp-space-4); }
.ks-head__title { font-size: var(--sp-type-display-size); line-height: var(--sp-type-display-line); font-weight: var(--sp-type-display-weight); letter-spacing: var(--sp-type-display-tracking); margin: 0; }
.ks-avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--c-you); color: var(--c-on-accent); flex: none; }
.ks-avatar--sm { width: 28px; height: 28px; font-size: 11px; }
.ks-avatar--opp { background: var(--c-opp); color: var(--c-on-opp); }
.ks-avatar--neutral { background: var(--c-line); color: var(--c-text); }
.ks-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 14px;
  border-radius: var(--sp-radius-pill); font-weight: 700; font-size: var(--sp-type-headline-size);
  background: var(--c-surface); border: 1px solid var(--c-border);
  max-width: 230px; white-space: nowrap;
}
.ks-pill span { overflow: hidden; text-overflow: ellipsis; }
.ks-pill svg { flex: none; width: 14px; height: 14px; opacity: .7; }

.ks-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
  border-radius: var(--sp-radius-pill); font-size: var(--sp-type-tag-size); line-height: 1;
  font-weight: var(--sp-type-tag-weight); font-stretch: var(--sp-type-tag-stretch);
  letter-spacing: var(--sp-type-tag-tracking); text-transform: uppercase; white-space: nowrap;
  background: var(--c-inset); color: var(--c-text);
}
.ks-chip--live { color: var(--c-live-text); }
.ks-chip--final { background: var(--c-inverse-bg); color: var(--c-inverse-fg); }
.ks-chip--money { background: var(--c-sunken); color: var(--c-text-2); }
.ks-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-live); flex: none; }
.ks-dot--pulse { animation: ks-pulse 1.6s var(--sp-motion-ease-settle) infinite; }
@keyframes ks-pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--c-live-glow); } 60% { box-shadow: 0 0 0 6px transparent; } }

/* ── Type helpers ──────────────────────────────────────────────────────── */
.ks-tag { font-size: var(--sp-type-tag-size); line-height: var(--sp-type-tag-line); font-weight: var(--sp-type-tag-weight); font-stretch: var(--sp-type-tag-stretch); letter-spacing: var(--sp-type-tag-tracking); text-transform: uppercase; color: var(--c-text-2); }
.ks-caption { font-size: var(--sp-type-caption-size); line-height: var(--sp-type-caption-line); font-weight: var(--sp-type-caption-weight); color: var(--c-text-2); }
.ks-callout { font-size: var(--sp-type-callout-size); line-height: var(--sp-type-callout-line); font-weight: var(--sp-type-callout-weight); }
.ks-headline { font-size: var(--sp-type-headline-size); line-height: var(--sp-type-headline-line); font-weight: var(--sp-type-headline-weight); }
.ks-title { font-size: var(--sp-type-title-size); line-height: var(--sp-type-title-line); font-weight: var(--sp-type-title-weight); margin: 0; }
.ks-num { font-variant-numeric: tabular-nums; }
.ks-muted { color: var(--c-text-2); }
.ks-gain { color: var(--c-gain); } .ks-loss { color: var(--c-loss); } .ks-zero { color: var(--c-zero); }
.ks-section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 var(--sp-space-3); }
.ks-section-h h3 { margin: 0; font-size: var(--sp-type-headline-size); line-height: var(--sp-type-headline-line); font-weight: 700; }

/* ── Scores (condensed 62%) + the shared ScoreRow ──────────────────────── */
.ks-score { font-weight: 900; font-stretch: 62%; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.01em; }
.ks-score--xl { font-size: var(--sp-type-score-xl-size); line-height: var(--sp-type-score-xl-line); }
.ks-score--lg { font-size: var(--sp-type-score-lg-size); line-height: var(--sp-type-score-lg-line); }
.ks-score--md { font-size: var(--sp-type-score-md-size); line-height: var(--sp-type-score-md-line); }
/* ScoreRow: two scores that can NEVER touch — a 1fr / 1fr grid with a
   ≥16px column gap; each score is fitted to its own column by ScoreRow's
   fit logic (both sides share the smaller size). */
.ks-scorerow { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--sp-space-5); align-items: end; }
.ks-scorerow > :last-child { text-align: right; }
.ks-rollin { animation: ks-rollin var(--sp-motion-duration-base) var(--sp-motion-ease-settle) both; }
@keyframes ks-rollin { from { transform: translateY(55%); opacity: 0; } to { transform: none; opacity: 1; } }

/* ── Tug bar ───────────────────────────────────────────────────────────── */
.ks-tug { display: flex; height: var(--sp-space-4); border-radius: var(--sp-radius-pill); overflow: hidden; background: var(--c-line); gap: 2px; }
.ks-tug__you { background: var(--c-you); transition: flex-grow var(--sp-motion-duration-feature) var(--sp-motion-ease-settle); }
.ks-tug__opp { background: var(--c-opp); transition: flex-grow var(--sp-motion-duration-feature) var(--sp-motion-ease-settle); }

/* ── Cards ─────────────────────────────────────────────────────────────── */
.ks-card { background: var(--c-surface); border-radius: var(--sp-radius-lg); box-shadow: var(--c-shadow); border: 1px solid var(--c-border); }
/* The scoreboard card. Emphasis WITHOUT an inverted surface: the theme's
   own surface, a faint accent wash from the top, a hairline border, and the
   type does the rest (condensed 900 scores, broadcast tags). */
.ks-game {
  background: linear-gradient(180deg, var(--c-accent-wash) 0, transparent 140px), var(--c-surface);
  color: var(--c-text); border-radius: var(--sp-radius-lg);
  border: 1px solid var(--c-border); box-shadow: var(--c-shadow);
}
.ks-raised { background: var(--c-inset); border-radius: var(--sp-radius-md); }

.ks-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: var(--sp-radius-md); background: var(--c-sunken); }
.ks-seg span { text-align: center; padding: 6px 0; border-radius: 8px; font-size: var(--sp-type-callout-size); font-weight: 600; color: var(--c-text-2); }
.ks-seg .on { background: var(--c-surface); color: var(--c-text); box-shadow: var(--c-shadow), 0 0 0 1px var(--c-border); }

.ks-btn { display: flex; align-items: center; justify-content: center; height: 50px; border-radius: var(--sp-radius-lg); font-weight: 700; font-size: var(--sp-type-headline-size); background: var(--c-primary-bg); color: var(--c-primary-fg); }
.ks-btn--ongame { /* retired: identical to .ks-btn */ }
.ks-btn--sell { background: var(--c-loss); color: var(--c-on-accent); }

/* ── Lists ─────────────────────────────────────────────────────────────── */
.ks-rows { list-style: none; margin: 0; padding: 0; }
.ks-row { display: grid; align-items: center; gap: var(--sp-space-4); padding: 11px 0; border-top: 1px solid var(--c-border); }
.ks-rows > .ks-row:first-child { border-top: 0; }
.ks-row { border-top-color: var(--c-line); }
.ks-logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 12px; background: var(--c-sunken); color: var(--c-text); letter-spacing: -0.02em; }
.ks-right { text-align: right; }
.ks-t { font-weight: 700; }

/* ── Home chart ────────────────────────────────────────────────────────── */
.ks-chart { display: block; width: 100%; height: 148px; overflow: visible; }
.ks-chart__line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }

<script>
// Key screens: canonical sample data (Design Lead, 2026-09-29).
//
// ONE league, ONE week, ONE set of people, shared by every key screen AND
// by the landing's phone (3a) AND by the mobile phases' dev fixtures.
// Everything a screen shows is DERIVED here from a few inputs (share
// quantities and prices), so the numbers reconcile by construction:
//   matchup score  = Σ per-holding week gain (each row rounded to cents first)
//   lead           = your score − their score
//   portfolio      = Σ quantity × price
//   standings      = records + points-for (season $ gain), sorted the way the
//                    app sorts (win %, then wins, then points-for:
//                    apps/mobile/app/(tabs)/league.tsx sortedStandings)
// Records are a legal league: after N weeks of 3 matchups, wins = losses.
//
// Scoring copy stays generic ("best performance wins"); data displays show
// the scorer's actual metric (dollar gain, percent as the tiebreak).
//
// Plain JS (no imports) so the board runs without a build; the port to
// apps/web is `export` on each const. formatMoney / tugRatio below are
// byte-for-byte ports of apps/web/src/design/lib/{money,tugRatio}.ts.

(function () {
  // ── Formatters (ports; keep in sync with design/lib) ───────────────────
  const MINUS = '−';
  const FIGURE_SPACE = ' ';
  function roundToCents(v) { return Math.round(Math.abs(v) * 100); }
  function formatMoney(value, opts) {
    const o = opts || {};
    const sign = o.sign || 'negative';
    const cents = roundToCents(value);
    const isZero = cents === 0;
    const isNeg = !isZero && value < 0;
    let s;
    if (isZero) s = o.alignSign ? FIGURE_SPACE : '';
    else if (isNeg) s = MINUS;
    else s = sign === 'always' ? '+' : o.alignSign ? FIGURE_SPACE : '';
    const dollars = Math.floor(cents / 100);
    if (o.compact && dollars >= 1000) {
      const tiers = [['T', 1e12], ['B', 1e9], ['M', 1e6], ['K', 1e3]];
      let i = tiers.findIndex((t) => dollars >= t[1]);
      let h = Math.round((cents * 100) / (tiers[i][1] * 100));
      while (h >= 100000 && i > 0) { i -= 1; h = Math.round((cents * 100) / (tiers[i][1] * 100)); }
      return `${s}$${Math.floor(h / 100)}.${String(h % 100).padStart(2, '0')}${tiers[i][0]}`;
    }
    const cp = String(cents % 100).padStart(2, '0');
    return `${s}$${String(dollars).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}.${cp}`;
  }
  /** Percent with the same sign rules as money: U+2212, zero unsigned. */
  function formatPct(v, opts) {
    const o = opts || {};
    const h = Math.round(Math.abs(v) * 100);
    if (h === 0) return '0.00%';
    const s = v < 0 ? MINUS : o.sign === 'always' ? '+' : '';
    return `${s}${Math.floor(h / 100)}.${String(h % 100).padStart(2, '0')}%`;
  }
  /** The ONE score-display helper. `s` is { gain, pct }. Returns the
   * deciding metric as the primary string and the tiebreak as secondary. */
  function scoreDisplay(s, scoring) {
    const sc = scoring || { decides: 'dollars', tiebreak: 'percent' };
    const money = formatMoney(s.gain, { sign: 'always' });
    const pctS = formatPct(s.pct, { sign: 'always' });
    return sc.decides === 'percent'
      ? { primary: pctS, secondary: money, value: s.pct }
      : { primary: money, secondary: pctS, value: s.gain };
  }
  function tugRatio(you, opp) {
    const d = Math.max(Math.abs(you) + Math.abs(opp), 1);
    return Math.min(0.92, Math.max(0.08, 0.5 + (0.5 * (you - opp)) / d));
  }
  const cents = (v) => Math.round(v * 100) / 100;
  const sum = (xs) => cents(xs.reduce((a, b) => a + b, 0));

  // ── The league ─────────────────────────────────────────────────────────
  const LEAGUE = {
    name: 'Stock Scudetto',
    week: 6,
    weeks: 14,
    stakeMode: 'fixed_notional',
    notionalPerSlot: 2000,
    slots: 6,
    // Draft pick clock: default 60s; the commissioner sets 30–90s (Giorgio,
    // 2026-09-29). Not yet in the backend: a server-enforced timeout is a
    // backend feature (auto-pick vs skip still to decide).
    pickClock: { seconds: 60, min: 30, max: 90, step: 15 },
    // What DECIDES a matchup. Today (DR-001) dollars decide in every stake
    // mode and percent breaks ties. Every score on every screen goes through
    // scoreDisplay() below, so changing this is a one-place edit.
    scoring: { decides: 'dollars', tiebreak: 'percent' },
  };

  const PLAYERS = [
    { id: 'paolo', name: 'Paolo M.', init: 'PM', seat: 1 },
    { id: 'roberto', name: 'Roberto B.', init: 'RB', seat: 2, you: true },
    { id: 'alessandro', name: 'Alessandro D.', init: 'AD', seat: 3 },
    { id: 'francesco', name: 'Francesco T.', init: 'FT', seat: 4 },
    { id: 'gianluigi', name: 'Gianluigi B.', init: 'GB', seat: 5 },
    { id: 'andrea', name: 'Andrea P.', init: 'AP', seat: 6 },
  ];
  const byId = Object.fromEntries(PLAYERS.map((p) => [p.id, p]));

  // ── The draft (6 teams, snake, 6 rounds) ───────────────────────────────
  /** Seat on the clock at overall pick n (1-based), snake order. */
  function seatForPick(n, teams) {
    const r = Math.ceil(n / teams);
    const i = (n - 1) % teams;
    return r % 2 === 1 ? i + 1 : teams - i;
  }
  // Overall picks 1–18 in order (R1 →, R2 ←, R3 →). A stock is drafted
  // once per league. Roberto (seat 2) picks 2, 11, 14, 23, 26, 35;
  // Gianluigi (seat 5) picks 5, 8, 17, 20, 29, 32 — matching H below.
  const DRAFT_BOARD = [
    'MSFT', 'NVDA', 'META', 'AVGO', 'AMZN', 'GOOGL',
    'COIN', 'JPM', 'AMD', 'PLTR', 'AAPL', 'LLY',
    'NFLX', 'CRM', 'ORCL', 'UBER', 'DIS', 'UNH',
  ];

  /** The Draft room screen's moment: draft night, round 2, pick 11,
   * you're on the clock, 0:42 left. Picks 1–10 are in. */
  const DRAFT_MOMENT = { pick: 11, secondsLeft: 42, secondsTotal: LEAGUE.pickClock.seconds, queued: 'AAPL' };
  const DRAFT_PICKS = Array.from({ length: 18 }, (_, k) => {
    const n = k + 1;
    const seat = seatForPick(n, 6);
    const player = PLAYERS.find((p) => p.seat === seat);
    const t = DRAFT_BOARD[k];
    return {
      pick: n,
      round: Math.ceil(n / 6),
      player: player.id,
      t: n < DRAFT_MOMENT.pick ? t : null, // not yet picked at the moment
      intended: t,
    };
  });
  /** Search results in the draft room at the moment (AAPL queued). */
  const DRAFT_SEARCH = {
    query: 'app',
    results: [
      { t: 'AAPL', co: 'Apple', price: 198.6, tag: 'Queued' },
      { t: 'APP', co: 'AppLovin', price: 88.4 },
      { t: 'APPF', co: 'AppFolio', price: 231.15 },
      { t: 'APPN', co: 'Appian', price: 30.72 },
    ],
  };

  // ── Holdings (fixed notional: $2,000 per slot at the draft price) ──────
  // Prices: draft = season start; mon = Week 6 Monday open (the week-start
  // price every week gain is measured from); thu = Thursday 1:37 PM ET
  // (the LIVE moment; also the landing tape's prices); fri = Friday close.
  // prev = Wednesday close (today's change base on Thursday).
  const H = {
    roberto: [
      { t: 'NVDA', co: 'NVIDIA', draft: 290.1, mon: 300.2, prev: 306.68, thu: 318.37, fri: 321.9, pick: 2 },
      { t: 'AAPL', co: 'Apple', draft: 198.6, mon: 205.1, prev: 208.83, thu: 211.42, fri: 214.8, pick: 11 },
      { t: 'CRM', co: 'Salesforce', draft: 262.4, mon: 268.0, prev: 269.96, thu: 271.35, fri: 274.1, pick: 14 },
      { t: 'TSLA', co: 'Tesla', draft: 262.8, mon: 251.9, prev: 249.66, thu: 248.36, fri: 250.1, pick: 23 },
      { t: 'COST', co: 'Costco', draft: 905.2, mon: 912.4, prev: 915.22, thu: 918.1, fri: 921.7, pick: 26 },
      { t: 'V', co: 'Visa', draft: 281.5, mon: 284.2, prev: 285.04, thu: 286.1, fri: 291.4, pick: 35 },
    ],
    gianluigi: [
      { t: 'AMZN', co: 'Amazon', draft: 221.3, mon: 238.1, prev: 239.22, thu: 236.4, fri: 234.9, pick: 5 },
      { t: 'JPM', co: 'JPMorgan', draft: 204.9, mon: 214.2, prev: 214.98, thu: 215.45, fri: 216.3, pick: 8 },
      { t: 'DIS', co: 'Disney', draft: 104.2, mon: 101.3, prev: 101.41, thu: 102.9, fri: 100.2, pick: 17 },
      { t: 'NKE', co: 'Nike', draft: 82.4, mon: 79.6, prev: 79.71, thu: 81.3, fri: 79.1, pick: 20 },
      { t: 'KO', co: 'Coca-Cola', draft: 68.1, mon: 69.4, prev: 69.47, thu: 69.9, fri: 69.85, pick: 29 },
      { t: 'BA', co: 'Boeing', draft: 172.6, mon: 176.3, prev: 176.02, thu: 176.9, fri: 175.4, pick: 32 },
    ],
  };
  // Draft shares, 4 dp (fractional shares under fixed notional).
  for (const side of Object.values(H)) {
    for (const h of side) h.qty = Math.round((LEAGUE.notionalPerSlot / h.draft) * 1e4) / 1e4;
  }

  /** Per-holding view at a moment ('thu' live or 'fri' final). Each row's
   * dollar gain is rounded to cents FIRST, and the score is the sum of the
   * rounded rows, so the lineup always adds up to the scoreboard. */
  function lineup(id, at) {
    return H[id].map((h) => {
      const price = h[at];
      const weekGain = cents(h.qty * (price - h.mon));
      const value = cents(h.qty * price);
      // Fixed notional: each slot's cost basis IS the notional ($2,000).
      const cost = LEAGUE.notionalPerSlot;
      const todayPct = ((h.thu - h.prev) / h.prev) * 100;
      const today = cents(h.qty * (h.thu - h.prev));
      return { ...h, price, weekGain, value, cost, gain: cents(value - cost), gainPct: ((price - h.draft) / h.draft) * 100, todayPct, today };
    });
  }
  function score(id, at) {
    const rows = lineup(id, at);
    const gain = sum(rows.map((r) => r.weekGain));
    const startValue = sum(H[id].map((h) => cents(h.qty * h.mon)));
    return { gain, pct: (gain / startValue) * 100, startValue, rows };
  }

  const MATCHUP = {
    you: 'roberto',
    opp: 'gianluigi',
    live: { label: 'Thu 1:37 PM ET', left: 'Ends Fri 4:00 PM ET · 1d 2h', you: score('roberto', 'thu'), opp: score('gianluigi', 'thu') },
    final: { label: 'Final', you: score('roberto', 'fri'), opp: score('gianluigi', 'fri') },
  };
  // Daily closes (cumulative week gain) for the matchup's week strip and
  // the landing's race chart. Mon–Wed closes are the landing's WEEK_CLOSES;
  // Thu is CHANGED (Gianluigi +$71.35, was −$12.55) so the LIVE moment
  // (Thu 1:37 PM, Gianluigi +$90.44) is a real game, not a pinned tug bar;
  // Fri is DERIVED from the holdings above (so the FINAL screen, the race
  // chart's end and the lineup all agree).
  const WEEK_CLOSES = [
    { day: 'Open', you: 0, opp: 0 },
    { day: 'Mon', you: 61.2, opp: 88.4 },
    { day: 'Tue', you: 142.75, opp: 101.3 },
    { day: 'Wed', you: 118.4, opp: 34.9 },
    { day: 'Thu', you: 238.6, opp: 71.35 },
    { day: 'Fri', you: MATCHUP.final.you.gain, opp: MATCHUP.final.opp.gain },
  ];
  // Chyrons, one per beat, each TRUE against WEEK_CLOSES.
  const CHYRONS = {
    Mon: 'Gianluigi B. opens the week ahead',
    Tue: 'NVDA +2.9% puts Roberto B. ahead',
    Wed: 'Roberto B. holds the lead through a red day',
    Thu: 'NKE +2.0% keeps Gianluigi B. in it',
    Fri: 'DIS −2.6% on Friday seals it', // (100.20 − 102.90) / 102.90
  };

  // ── Standings ──────────────────────────────────────────────────────────
  // Weeks 1–5 are a legal league (15 wins = 15 losses). Week 6 pairings:
  // Roberto–Gianluigi, Paolo–Alessandro, Francesco–Andrea.
  // Season gain = the sum of a manager's weekly matchup gains. Roberto's
  // weeks 1–5 are ROBERTO_WEEKS below (sum +$129.99), so his season gain,
  // his Home chart and his portfolio's gain since the draft all agree.
  const ROBERTO_WEEKS = [
    { week: 1, gain: 41.3, result: 'W' },
    { week: 2, gain: 58.75, result: 'W' },
    { week: 3, gain: -96.4, result: 'L' },
    { week: 4, gain: 72.1, result: 'W' },
    { week: 5, gain: 54.24, result: 'W' },
  ];
  const THROUGH_W5 = {
    paolo: { w: 5, l: 0, pf: 512.4 },
    roberto: { w: 4, l: 1, pf: sum(ROBERTO_WEEKS.map((w) => w.gain)) },
    alessandro: { w: 3, l: 2, pf: 348.15 },
    francesco: { w: 2, l: 3, pf: 96.2 },
    gianluigi: { w: 1, l: 4, pf: -142.35 },
    andrea: { w: 0, l: 5, pf: -231.8 },
  };
  const WEEK6 = [
    { a: 'roberto', b: 'gianluigi', ga: MATCHUP.final.you.gain, gb: MATCHUP.final.opp.gain },
    { a: 'paolo', b: 'alessandro', ga: -48.3, gb: 96.15 },
    { a: 'francesco', b: 'andrea', ga: 61.4, gb: -22.75 },
  ];
  function standings(rec) {
    return PLAYERS.map((p) => ({ ...p, ...rec[p.id] }))
      .sort((x, y) => {
        const px = x.w / (x.w + x.l);
        const py = y.w / (y.w + y.l);
        if (py !== px) return py - px;
        if (y.w !== x.w) return y.w - x.w;
        return y.pf - x.pf;
      })
      .map((r, i) => ({ ...r, rank: i + 1 }));
  }
  const AFTER_W6 = JSON.parse(JSON.stringify(THROUGH_W5));
  for (const m of WEEK6) {
    const aWins = m.ga > m.gb;
    AFTER_W6[m.a].w += aWins ? 1 : 0;
    AFTER_W6[m.a].l += aWins ? 0 : 1;
    AFTER_W6[m.b].w += aWins ? 0 : 1;
    AFTER_W6[m.b].l += aWins ? 1 : 0;
    AFTER_W6[m.a].pf = cents(AFTER_W6[m.a].pf + m.ga);
    AFTER_W6[m.b].pf = cents(AFTER_W6[m.b].pf + m.gb);
  }
  const STANDINGS_BEFORE = standings(THROUGH_W5);
  const STANDINGS_FINAL = standings(AFTER_W6).map((r) => {
    const before = STANDINGS_BEFORE.find((b) => b.id === r.id).rank;
    return { ...r, delta: before - r.rank };
  });

  // ── Portfolio + Home ───────────────────────────────────────────────────
  const PORTFOLIO_LIVE = (() => {
    const rows = lineup('roberto', 'thu');
    const value = sum(rows.map((r) => r.value));
    const cost = sum(rows.map((r) => r.cost));
    const today = sum(rows.map((r) => r.today));
    const prevValue = sum(rows.map((r) => cents(r.qty * r.prev)));
    return { rows, value, cost, gain: cents(value - cost), gainPct: ((value - cost) / cost) * 100, today, todayPct: (today / prevValue) * 100 };
  })();

  // Home shows ONE league: the one picked in the league pill (Giorgio,
  // 2026-09-29). Other leagues appear only as a small switcher row.
  const OTHER_LEAGUES = [
    { name: 'Friday Night Stocks', phase: 'live_open', status: 'Week 2 · Live', rank: '3rd of 8', record: '1–0' },
    { name: 'Serie A Traders', phase: 'pre_draft', status: 'Draft Sat 7:00 PM', rank: null, record: null },
  ];

  // Home chart: this league's cumulative gain since the draft (value − cost
  // + realized; no trades yet, so value − cost), one point per trading day.
  // Weeks 1–5 end exactly on each week's result; Week 6 follows the matchup's
  // daily closes, and the last point is the LIVE gain. Weekend gaps are zero
  // in this sample (Monday opens at Friday's close), so the chart's rise this
  // week equals the matchup score.
  const DAY_SHAPES = [
    [0.4, 0.9, 0.6, 1.2, 1],
    [0.3, 0.2, 0.7, 0.9, 1],
    [-0.2, 0.3, 0.6, 0.85, 1],
    [0.5, 1.1, 0.8, 0.7, 1],
    [0.2, -0.3, 0.4, 0.9, 1],
  ];
  const HOME = (() => {
    const P = PORTFOLIO_LIVE;
    const series = [0];
    const weekStarts = [0];
    let base = 0;
    ROBERTO_WEEKS.forEach((w, i) => {
      DAY_SHAPES[i].forEach((f) => series.push(cents(base + w.gain * f)));
      base = cents(base + w.gain);
      weekStarts.push(series.length - 1);
    });
    // Week 6: Mon–Wed closes, then Thursday live.
    WEEK_CLOSES.slice(1, 4).forEach((d) => series.push(cents(base + d.you)));
    series.push(P.gain);
    return {
      value: P.value,
      gain: P.gain,
      gainPct: P.gainPct,
      today: P.today,
      todayPct: P.todayPct,
      series,
      weekStarts, // index where each week begins (W1..W6)
      weekResults: ROBERTO_WEEKS,
      throughW5: base,
      rank: 2,
      record: '4–1',
    };
  })();

  // The stock sheet (NVDA), Thursday live.
  const NVDA = (() => {
    const r = PORTFOLIO_LIVE.rows.find((x) => x.t === 'NVDA');
    return {
      ...r,
      dayPoints: [306.68, 307.9, 309.4, 308.7, 311.2, 313.05, 312.4, 314.9, 316.2, 315.6, 317.1, 318.37],
      range: ['1D', '1W', '1M', '3M', '1Y'],
      ownership: 'Drafted by you · Round 1, pick 2',
    };
  })();

  // Trading in a fixed-per-slot league (Giorgio, 2026-09-29): buy and sell
  // freely, but a replacement buy invests exactly the SALE PROCEEDS of the
  // slot it refills (sell at $1,890.12 → buy $1,890.12, never a fresh
  // $2,000). One stock per slot; uninvested proceeds sit as cash in that
  // slot, earn nothing, and count in value; the manager picks which freed
  // slot funds a buy. Sample: sell TSLA at Thursday's price, buy SHOP.
  const SALE = (() => {
    const r = PORTFOLIO_LIVE.rows.find((x) => x.t === 'TSLA');
    const buy = { t: 'SHOP', co: 'Shopify', price: 104.2, todayPct: 1.12 };
    buy.qty = Math.floor((r.value / buy.price) * 1e4) / 1e4;
    // A second freed slot, for the "which sale pays?" picker (hypothetical:
    // V sold at Wednesday's close). record-trade's preview returns one
    // source per sale with unspent proceeds.
    const v = PORTFOLIO_LIVE.rows.find((x) => x.t === 'V');
    const sources = [
      { symbol: r.t, amount: r.value, when: 'Thu 1:38 PM' },
      { symbol: 'V', amount: cents(v.qty * v.prev), when: 'Wed 3:58 PM' },
    ];
    return { sold: r.t, proceeds: r.value, realized: cents(r.value - r.cost), buy, sources };
  })();

  window.KS = {
    formatMoney, formatPct, tugRatio,
    LEAGUE, PLAYERS, byId, seatForPick,
    DRAFT_MOMENT, DRAFT_PICKS, DRAFT_SEARCH,
    MATCHUP, WEEK_CLOSES, CHYRONS,
    STANDINGS_BEFORE, STANDINGS_FINAL, WEEK6,
    PORTFOLIO_LIVE, OTHER_LEAGUES, HOME, NVDA, ROBERTO_WEEKS, SALE,
    lineup, score, scoreDisplay,
  };
})();

</script>
<script type="text/babel" data-presets="react">
// Key screens: the app's five key screens as React components (Design Lead,
// 2026-09-29). The single source of truth for BOTH the landing's phone
// (3a) and mobile phases 3b-1 / 3b-2 / 3c / 3e.
//
// Written against the web foundation's tokens (tokens.css --sp-*) and the
// canonical data in data.js (window.KS). No build: the board compiles this
// with Babel standalone. Port to apps/web: drop the IIFE, `export` each
// screen, import KS from sampleData, and swap Roll/ScoreRow/Tug for the
// foundation's ScoreDigits/TugBar where they already exist.

(function () {
  const { useState, useEffect, useLayoutEffect, useRef } = React;
  const K = window.KS;
  const $ = (v, o) => K.formatMoney(v, o);
  const $s = (v) => K.formatMoney(v, { sign: 'always' });
  const pct = (v) => K.formatPct(v, { sign: 'always' });
  const tone = (v) => (Math.round(Math.abs(v) * 100) === 0 ? 'ks-zero' : v > 0 ? 'ks-gain' : 'ks-loss');
  // Every score goes through ONE helper (data.js scoreDisplay): the metric
  // that decides the matchup is primary, the tiebreak secondary.
  const SD = (x) => K.scoreDisplay(x, K.LEAGUE.scoring);
  const margin = (a, b) =>
    K.LEAGUE.scoring.decides === 'percent'
      ? `${Math.abs(a.pct - b.pct).toFixed(2)} pts`
      : $(Math.abs(a.gain - b.gain));
  const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── Icons (one outline set; filled weight on the active tab) ──────────
  const ICON = {
    home: 'M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z',
    matchup: 'M4 17 9 11l4 4 7-8M15 7h5v5',
    league: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3',
    portfolio: 'M4 20V10M10 20V4M16 20v-8M22 20H2',
    chevron: 'm6 9 6 6 6-6',
    search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4',
    plus: 'M12 5v14M5 12h14',
    close: 'M6 6l12 12M18 6 6 18',
    right: 'm9 6 6 6-6 6',
  };
  function Icon({ d, size = 24, width = 2 }) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={width} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <path d={d} />
      </svg>
    );
  }

  // ── Device chrome ─────────────────────────────────────────────────────
  const TABS = [['home', 'Home'], ['matchup', 'Matchup'], ['league', 'League'], ['portfolio', 'Portfolio']];
  function Device({ game, tab, children, overlay, label, noTabs }) {
    return (
      <div className="ks-device" role="img" aria-label={label}>
        <div className="ks-os">
          <span>1:37</span>
          <span className="ks-os__island" />
          <span className="ks-os__icons">
            <span className="ks-os__bars"><i /><i /><i /><i /></span>
            <span className="ks-os__batt"><i /></span>
          </span>
        </div>
        <div className="ks-scroll" style={noTabs ? { bottom: 34 } : undefined}>{children}</div>
        {noTabs ? null : <nav className="ks-tabs">
          {TABS.map(([id, name]) => (
            <span key={id} className={id === tab ? 'ks-tabs__t ks-tabs__t--on' : 'ks-tabs__t'}>
              <Icon d={ICON[id]} width={id === tab ? 2.4 : 1.8} />
              {name}
            </span>
          ))}
        </nav>}
        <span className="ks-home-ind" />
        {overlay}
      </div>
    );
  }
  function LeagueHead({ chip, sub }) {
    return (
      <div className="ks-head">
        <span className="ks-pill"><span>{K.LEAGUE.name}</span><Icon d={ICON.chevron} size={14} width={2.6} /></span>
        {chip}
        {sub}
      </div>
    );
  }
  function Chip({ kind, children }) {
    return (
      <span className={`ks-chip ks-chip--${kind}`}>
        {kind === 'live' ? <span className="ks-dot ks-dot--pulse" /> : null}
        {children}
      </span>
    );
  }

  // ── Roll: per-character roll on change, never on first paint ──────────
  function Roll({ text, className }) {
    const first = useRef(true);
    const prev = useRef(text);
    useEffect(() => { first.current = false; prev.current = text; });
    const old = prev.current;
    return (
      <span className={className} aria-label={text}>
        {text.split('').map((c, i) => (
          <span
            key={`${i}-${c}`}
            aria-hidden="true"
            style={{ display: 'inline-block' }}
            className={!first.current && old[i] !== c && !reduced() ? 'ks-rollin' : undefined}
          >
            {c}
          </span>
        ))}
      </span>
    );
  }

  // ── Scores: the shared ScoreRow. Two scores that never touch: a 1fr/1fr
  // grid with a ≥16px gap, and ONE shared size (the largest at which BOTH
  // fit their columns), so the widest pair (+$351.77 / −$38.88) is safe.
  function Scores({ left, right, size = 'xl', leftTone, rightTone }) {
    const ref = useRef(null);
    const [k, setK] = useState(1);
    useLayoutEffect(() => {
      const el = ref.current;
      if (!el) return;
      el.style.setProperty('--k', '1');
      let s = 1;
      el.querySelectorAll('.ks-scorerow > div').forEach((cell) => {
        const inner = cell.firstChild;
        if (inner.scrollWidth > cell.clientWidth) s = Math.min(s, cell.clientWidth / inner.scrollWidth);
      });
      el.style.setProperty('--k', String(s));
      setK(s);
    }, [left, right]);
    return (
      <div ref={ref} style={{ fontSize: `calc(var(--sp-type-score-${size}-size) * var(--k, 1))`, lineHeight: 1 }} data-k={k.toFixed(2)}>
        <div className="ks-scorerow">
          <div><Roll text={left} className={`ks-score ${leftTone || ''}`} /></div>
          <div><Roll text={right} className={`ks-score ${rightTone || ''}`} /></div>
        </div>
      </div>
    );
  }

  /** Ticker tile: the full symbol, sized to fit (never a 2-letter guess). */
  function Logo({ t, game }) {
    const size = t.length <= 2 ? 13 : t.length === 3 ? 11 : 9.5;
    const style = game ? { background: 'var(--c-inset)', color: 'var(--c-text)', fontSize: size } : { fontSize: size };
    return <span className="ks-logo" style={style}>{t}</span>;
  }

  function Tug({ you, opp }) {
    const r = K.tugRatio(you, opp);
    return (
      <div className="ks-tug" aria-label={`Tug of war: you ${$s(you)}, opponent ${$s(opp)}`}>
        <span className="ks-tug__you" style={{ flexGrow: r }} />
        <span className="ks-tug__opp" style={{ flexGrow: 1 - r }} />
      </div>
    );
  }

  // ── Line chart helper (zero baseline, gain above / loss below) ─────────
  function GainChart({ series, w = 362, h = 148, marker, weeks, run, label = 'Cumulative gain' }) {
    const pad = { t: 10, b: 22, l: 0, r: 0 };
    const min = Math.min(0, ...series);
    const max = Math.max(0, ...series);
    const x = (i) => pad.l + (i / (series.length - 1)) * (w - pad.l - pad.r);
    const y = (v) => pad.t + (1 - (v - min) / (max - min || 1)) * (h - pad.t - pad.b);
    const d = series.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = `${d} L${x(series.length - 1)},${y(0)} L${x(0)},${y(0)} Z`;
    const z = y(0);
    const id = useRef(`c${Math.random().toString(36).slice(2, 8)}`).current;
    const end = series[series.length - 1];
    return (
      <svg className="ks-chart" viewBox={`0 0 ${w} ${h}`} role="img" aria-label={`${label}: ${$s(end)}`}>
        <defs>
          <clipPath id={`${id}a`}><rect x="0" y="0" width={w} height={z} /></clipPath>
          <clipPath id={`${id}b`}><rect x="0" y={z} width={w} height={h - z} /></clipPath>
        </defs>
        <path d={area} fill="var(--c-gain)" opacity=".1" clipPath={`url(#${id}a)`} />
        <path d={area} fill="var(--c-loss)" opacity=".1" clipPath={`url(#${id}b)`} />
        <line x1="0" x2={w} y1={z} y2={z} stroke="var(--c-border-strong)" strokeDasharray="3 4" strokeWidth="1" />
        <g className={run ? 'ks-draw ks-draw--run' : 'ks-draw'} style={{ '--len': 1 }} key={run ? 'r' : 's'}>
          <path d={d} pathLength="1" className="ks-chart__line" stroke="var(--c-gain)" clipPath={`url(#${id}a)`} strokeDasharray="1" />
          <path d={d} pathLength="1" className="ks-chart__line" stroke="var(--c-loss)" clipPath={`url(#${id}b)`} strokeDasharray="1" />
        </g>
        <circle cx={x(series.length - 1)} cy={y(end)} r="4" fill="var(--c-gain)" stroke="var(--c-surface)" strokeWidth="2" />
        {marker != null ? (
          <g>
            <line x1={x(marker)} x2={x(marker)} y1={z - 5} y2={z + 5} stroke="var(--c-text-2)" strokeWidth="1.5" />
            <text x={x(marker)} y={h - 4} textAnchor="middle" fontSize="11" fontWeight="600" fill="var(--c-text-2)">Joined Friday Night Stocks</text>
          </g>
        ) : null}
        {weeks ? weeks.map((ix, k) => (
          <g key={k}>
            <line x1={x(ix)} x2={x(ix)} y1={h - 20} y2={h - 16} stroke="var(--c-border-strong)" strokeWidth="1" />
            <text x={Math.min(x(ix) + 2, w - 18)} y={h - 4} fontSize="11" fontWeight="600" fill="var(--c-text-2)">W{k + 1}</text>
          </g>
        )) : null}
        <text x="2" y={z - 6} fontSize="11" fontWeight="600" fill="var(--c-text-2)">$0</text>
      </svg>
    );
  }

  // Week race chart (the landing /03 chart, small, on a game surface).
  function WeekRace({ upto, live }) {
    const w = 330, h = 118, pb = 20, pt = 10;
    const pts = K.WEEK_CLOSES.slice(0, upto + 1).map((p, i) => ({ ...p, x: i }));
    if (live) pts.push({ day: 'now', x: upto + live.frac, you: live.you, opp: live.opp });
    const all = K.WEEK_CLOSES.flatMap((p) => [p.you, p.opp]).concat(live ? [live.you, live.opp] : []);
    const min = Math.min(0, ...all), max = Math.max(0, ...all);
    const X = (i) => 8 + (i / 5) * (w - 16);
    const Y = (v) => pt + (1 - (v - min) / (max - min)) * (h - pt - pb);
    const line = (k) => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(' ');
    const last = pts[pts.length - 1];
    return (
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} role="img" aria-label="Week 6 race: cumulative dollar gain by day">
        <line x1="8" x2={w - 8} y1={Y(0)} y2={Y(0)} stroke="var(--c-line)" strokeDasharray="3 4" />
        <path d={line('opp')} fill="none" stroke="var(--c-opp)" strokeWidth="2.25" strokeLinejoin="round" />
        <path d={line('you')} fill="none" stroke="var(--c-you-text)" strokeWidth="2.5" strokeLinejoin="round" />
        <circle cx={X(last.x)} cy={Y(last.opp)} r="3.5" fill="var(--c-opp)" />
        <circle cx={X(last.x)} cy={Y(last.you)} r="4" fill="var(--c-you-text)" />
        {['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map((d, i) => (
          <text key={d} x={X(i + 1)} y={h - 4} textAnchor="middle" fontSize="12" fontWeight="600" fill="var(--c-text-2)">{d}</text>
        ))}
      </svg>
    );
  }

  // ═════════════════════════════════════════════════════════════════════
  // 4. DRAFT ROOM (on the clock, the snake board, search, your roster)
  // ═════════════════════════════════════════════════════════════════════
  function SnakeBoard({ current, landed }) {
    const ref = useRef(null);
    const cells = useRef({});
    const [geo, setGeo] = useState(null);
    useLayoutEffect(() => {
      const box = ref.current.getBoundingClientRect();
      const k = box.width / ref.current.offsetWidth || 1; // undo the board's CSS scale
      const c = {};
      for (const [n, el] of Object.entries(cells.current)) {
        if (!el) continue;
        const r = el.getBoundingClientRect();
        c[n] = { x: (r.left - box.left + r.width / 2) / k, y: (r.top - box.top + r.height / 2) / k, w: r.width / k, h: r.height / k };
      }
      setGeo({ c, w: ref.current.offsetWidth });
    }, []);
    const picks = K.DRAFT_PICKS;
    const seats = [...K.PLAYERS].sort((a, b) => a.seat - b.seat);
    const rows = [1, 2, 3].map((r) => picks.filter((p) => p.round === r).sort((a, b) => K.seatForPick(a.pick, 6) - K.seatForPick(b.pick, 6)));
    // The track: through every pick centre in pick order; between rounds, a
    // half-loop OUTSIDE the row ends (right after odd rounds, left after even).
    function path(toPick) {
      if (!geo) return '';
      let d = '';
      for (let n = 1; n <= toPick; n++) {
        const p = geo.c[n];
        if (n === 1) { d += `M${p.x},${p.y}`; continue; }
        const q = geo.c[n - 1];
        if (p.y !== q.y) {
          const right = Math.ceil((n - 1) / 6) % 2 === 1;
          const r = (p.y - q.y) / 2;
          // A 14px-deep half-loop just outside the row end (stays inside
          // the 20px screen gutter), then into the next round's first cell.
          const edge = right ? q.x + q.w / 2 + 2 : q.x - q.w / 2 - 2;
          d += ` L${edge},${q.y} A14,${r} 0 0 ${right ? 1 : 0} ${edge},${p.y} L${p.x},${p.y}`;
        } else d += ` L${p.x},${p.y}`;
      }
      return d;
    }
    const chevrons = [];
    if (geo) {
      for (let n = 2; n <= 18; n++) {
        const p = geo.c[n], q = geo.c[n - 1];
        if (p.y !== q.y) continue;
        chevrons.push({ n, x: (p.x + q.x) / 2, y: p.y, dir: p.x > q.x ? 1 : -1 });
      }
    }
    // The blue (drawn) track runs to whoever is on the clock.
    const reach = landed ? current + 1 : current;
    return (
      <div>
        <div className="ks-board__cols" style={{ marginBottom: 6 }}>
          {seats.map((p) => <span key={p.id} className="ks-tag" style={p.you ? { color: 'var(--c-you-text)' } : undefined}>{p.init}</span>)}
        </div>
        <div className="ks-board" ref={ref} style={{ display: 'grid', rowGap: 18 }}>
          <svg className="ks-board__track" width="100%" height="100%" aria-hidden="true">
            <path d={path(18)} fill="none" stroke="var(--c-line)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
            <path d={path(reach)} fill="none" stroke="var(--c-you)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" style={{ transition: 'all var(--sp-motion-duration-slow) var(--sp-motion-ease-settle)' }} />
            {chevrons.map((c) => (
              <path key={c.n} d={`M${c.x - 2 * c.dir},${c.y - 4} L${c.x + 2 * c.dir},${c.y} L${c.x - 2 * c.dir},${c.y + 4}`} fill="none" stroke={c.n <= reach ? 'var(--c-on-accent)' : 'var(--c-text-2)'} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" />
            ))}
          </svg>
          {rows.map((row, ri) => (
            <div key={ri} className="ks-board__row">
              {row.map((p) => {
                const you = K.byId[p.player].you;
                const isClock = landed ? p.pick === current + 1 : p.pick === current;
                const filled = p.pick < current || (landed && p.pick === current);
                const cls = ['ks-cell', you ? 'ks-cell--you' : '', isClock ? 'ks-cell--clock' : '', !filled && !isClock ? 'ks-cell--future' : '', landed && p.pick === current ? 'ks-cell--landed' : ''].join(' ');
                return (
                  <div key={p.pick} className={cls} ref={(el) => (cells.current[p.pick] = el)}>
                    <span className="ks-cell__n">{p.pick}</span>
                    {filled ? <span className="ks-cell__t">{p.intended}</span> : <span className="ks-cell__t" style={{ opacity: 0 }}>·</span>}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
        <div className="ks-board__rlabel ks-caption ks-muted" style={{ marginTop: 10 }}>
          <span>Round 1 → · Round 2 ← · Round 3 →</span>
          <span>Order reverses each round</span>
        </div>
      </div>
    );
  }

  function DraftScreen({ landed }) {
    const D = K.DRAFT_MOMENT;
    const secs = landed ? D.secondsTotal : D.secondsLeft;
    const frac = secs / D.secondsTotal;
    const R = 36, C = 2 * Math.PI * R;
    return (
      <Device game tab="league" label="Draft room">
        <LeagueHead chip={<Chip kind="live">Drafting</Chip>} />
        <div className="ks-pad ks-stack" style={{ gap: 16 }}>
          <div className="ks-raised" style={{ padding: 14, display: 'flex', gap: 14, alignItems: 'center' }}>
            <div className="ks-ring">
              <svg width="84" height="84" viewBox="0 0 84 84">
                <circle cx="42" cy="42" r={R} fill="none" stroke="var(--c-line)" strokeWidth="6" />
                <circle cx="42" cy="42" r={R} fill="none" stroke={landed ? 'var(--c-text-2)' : 'var(--c-live)'} strokeWidth="6" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - frac)} style={{ transition: 'stroke-dashoffset 1s linear' }} />
              </svg>
              <span className="ks-ring__t">{`${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`}</span>
            </div>
            <div style={{ display: 'grid', gap: 2 }}>
              {landed ? (
                <>
                  <span className="ks-title">Paolo M. is up</span>
                  <span className="ks-callout ks-muted">Round 2 · Pick 12, then 13</span>
                  <span className="ks-caption" style={{ color: 'var(--c-you-text)' }}>You took AAPL · next pick 14</span>
                </>
              ) : (
                <>
                  <span className="ks-title" style={{ color: 'var(--c-live-text)' }}>You're on the clock</span>
                  <span className="ks-callout">Round 2 · Pick 11</span>
                  <span className="ks-caption ks-muted">Then Paolo M. picks twice (12, 13)</span>
                  <span className="ks-caption ks-muted">{D.secondsTotal}-second picks · set by the commissioner</span>
                </>
              )}
            </div>
          </div>
          <SnakeBoard current={D.pick} landed={landed} />
          <div style={{ display: 'grid', gap: 10 }}>
            <div className="ks-search">
              <Icon d={ICON.search} size={18} />
              <span className="ks-callout">{K.DRAFT_SEARCH.query}</span><span className="ks-caret" />
            </div>
            <ul className="ks-rows">
              {K.DRAFT_SEARCH.results.map((r, i) => (
                <li key={r.t} className="ks-row" style={{ gridTemplateColumns: '36px 1fr auto auto', padding: '9px 0' }}>
                  <Logo t={r.t} game />
                  <span><span className="ks-t ks-callout">{r.t}</span><br /><span className="ks-caption ks-muted">{r.co}</span></span>
                  <span className="ks-callout ks-num ks-muted">{$(r.price)}</span>
                  {i === 0 ? (
                    <span className={landed ? 'ks-chip' : 'ks-btn ks-btn--ongame'} style={landed ? undefined : { height: 34, padding: '0 14px', fontSize: 14 }}>{landed ? 'Drafted' : 'Draft'}</span>
                  ) : (
                    <span className="ks-muted" aria-label="Queue"><Icon d={ICON.plus} size={20} /></span>
                  )}
                </li>
              ))}
            </ul>
          </div>
          <div>
            <div className="ks-section-h"><h3>Your roster</h3><span className="ks-caption ks-muted">{landed ? 2 : 1} of 6 · $2,000 per slot</span></div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
              {['NVDA', landed ? 'AAPL' : null, null, null, null, null].map((t, i) => (
                <span key={i} className={t ? 'ks-slot ks-slot--on' + (i === 1 ? ' ks-fade-in' : '') : 'ks-slot'}>{t || `Rd ${i + 1}`}</span>
              ))}
            </div>
          </div>
        </div>
      </Device>
    );
  }

  /** Create league · Draft step (the same controls appear in League
   * settings until the draft starts). Pick clock: 30–90s, default 60s. */
  function DraftSettingsScreen() {
    const pc = K.LEAGUE.pickClock;
    const opts = [];
    for (let v = pc.min; v <= pc.max; v += pc.step) opts.push(v);
    const Row = ({ k, v, sub }) => (
      <li className="ks-row" style={{ gridTemplateColumns: '1fr auto 16px', padding: '13px 0' }}>
        <span><span className="ks-callout" style={{ fontWeight: 600 }}>{k}</span>{sub ? <><br /><span className="ks-caption">{sub}</span></> : null}</span>
        <span className="ks-callout ks-muted">{v}</span>
        <span className="ks-muted"><Icon d={ICON.right} size={16} /></span>
      </li>
    );
    return (
      <Device noTabs label="Create league, draft settings">
        <div className="ks-head">
          <span className="ks-muted" style={{ display: 'flex', alignItems: 'center', gap: 2 }}><span style={{ transform: 'rotate(180deg)', display: 'flex' }}><Icon d={ICON.right} size={20} /></span><span className="ks-callout">Back</span></span>
          <span className="ks-caption ks-num">Step 3 of 4</span>
        </div>
        <div className="ks-pad ks-stack">
          <div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 4, marginBottom: 14 }}>
              {[1, 2, 3, 4].map((i) => <span key={i} style={{ height: 4, borderRadius: 2, background: i <= 3 ? 'var(--c-accent)' : 'var(--c-border)' }} />)}
            </div>
            <h2 className="ks-head__title" style={{ fontSize: 28 }}>Draft</h2>
            <p className="ks-callout ks-muted" style={{ margin: '4px 0 0' }}>A live snake draft. Everyone picks in turn, and the order reverses each round.</p>
          </div>
          <div className="ks-card" style={{ padding: 14, display: 'grid', gap: 10 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <span className="ks-headline" style={{ fontWeight: 700 }}>Pick clock</span>
              <span className="ks-callout ks-num"><b>{pc.seconds} seconds</b></span>
            </div>
            <div className="ks-seg">
              {opts.map((v) => <span key={v} className={v === pc.seconds ? 'on ks-num' : 'ks-num'}>{v}s</span>)}
            </div>
            <span className="ks-caption">Time each manager has to make a pick. 60 seconds is the default.</span>
          </div>
          <div className="ks-card" style={{ padding: '2px 14px' }}>
            <ul className="ks-rows">
              <Row k="Draft date" v="Sat, Oct 3 · 7:00 PM" />
              <Row k="Draft order" v="Random" sub="Set when the draft starts" />
              <Row k="Rounds" v="6" sub="One per roster slot" />
              <Row k="If time runs out" v="Auto-pick" sub="From your queue, then the top-ranked stock" />
            </ul>
          </div>
          <span className="ks-btn">Next</span>
        </div>
      </Device>
    );
  }

  // ═════════════════════════════════════════════════════════════════════
  // 5. PORTFOLIO + STOCK SHEET (Sell pre-selected)
  // ═════════════════════════════════════════════════════════════════════
  function StockSheet({ open }) {
    const N = K.NVDA;
    const pts = N.dayPoints;
    const w = 362, h = 120;
    const min = Math.min(...pts) - 1, max = Math.max(...pts) + 1;
    const X = (i) => (i / (pts.length - 1)) * (w - 8);
    const Y = (v) => 6 + (1 - (v - min) / (max - min)) * (h - 12);
    const d = pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const perShare = N.thu - N.prev;
    return (
      <>
        <div className="ks-scrim" style={{ opacity: open ? 1 : 0, pointerEvents: 'none' }} />
        <div className={open ? 'ks-sheet' : 'ks-sheet ks-sheet--hidden'} aria-hidden={!open}>
          <div className="ks-grabber" />
          <div style={{ padding: '10px 20px 20px', display: 'grid', gap: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <Logo t="NVDA" />
              <span style={{ flex: 1 }}><span className="ks-headline" style={{ fontWeight: 800 }}>NVDA</span><br /><span className="ks-caption">NVIDIA</span></span>
              <span className="ks-muted"><Icon d={ICON.close} size={22} /></span>
            </div>
            <div>
              <div className="ks-num" style={{ fontSize: 34, lineHeight: '38px', fontWeight: 800 }}>{$(N.thu)}</div>
              <div className="ks-callout ks-gain ks-num" style={{ fontWeight: 700 }}>{$s(perShare)} · {pct(N.todayPct)} <span className="ks-muted" style={{ fontWeight: 500 }}>today</span></div>
            </div>
            <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} role="img" aria-label="NVDA today">
              <line x1="0" x2={w} y1={Y(N.prev)} y2={Y(N.prev)} stroke="var(--c-border-strong)" strokeDasharray="3 4" />
              <text x="0" y={Y(N.prev) + 14} fontSize="11" fontWeight="600" fill="var(--c-text-2)">Prev close {$(N.prev)}</text>
              <path d={d} fill="none" stroke="var(--c-gain)" strokeWidth="2.25" strokeLinejoin="round" />
              <circle cx={X(pts.length - 1)} cy={Y(pts[pts.length - 1])} r="4" fill="var(--c-gain)" stroke="var(--c-surface)" strokeWidth="2" />
            </svg>
            <div className="ks-seg">{N.range.map((r, i) => <span key={r} className={i === 0 ? 'on' : undefined}>{r}</span>)}</div>
            <div className="ks-card" style={{ padding: 14, boxShadow: 'none', background: 'var(--c-sunken)', border: 0 }}>
              <div className="ks-section-h"><h3>Your position</h3><span className="ks-caption">{N.ownership}</span></div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', rowGap: 10 }} className="ks-num">
                <span><span className="ks-caption">Shares</span><br /><b>{N.qty.toFixed(4)}</b></span>
                <span><span className="ks-caption">Avg entry</span><br /><b>{$(N.draft)}</b></span>
                <span><span className="ks-caption">Value</span><br /><b>{$(N.value)}</b></span>
                <span><span className="ks-caption">Gain</span><br /><b className="ks-gain">{$s(N.gain)} · {pct((N.gain / N.cost) * 100)}</b></span>
              </div>
            </div>
            <div className="ks-seg" style={{ height: 40 }}><span>Buy</span><span className="on">Sell</span></div>
            <div className="ks-callout ks-num"><b>Sell all {N.qty.toFixed(4)} sh ≈ {$(N.value)}</b><br /><span className="ks-caption">A slot holds one stock, so you sell the whole position. The cash stays in this slot to reinvest.</span></div>
            <span className="ks-btn">Review sell</span>
          </div>
        </div>
      </>
    );
  }

  /** Buy with a freed slot's proceeds (fixed-per-slot leagues): the amount
   * is capped at that slot's cash, never a fresh $2,000. */
  function BuySheet({ open }) {
    const S = K.SALE, B = S.buy;
    return (
      <>
        <div className="ks-scrim" style={{ opacity: open ? 1 : 0, pointerEvents: 'none' }} />
        <div className={open ? 'ks-sheet' : 'ks-sheet ks-sheet--hidden'} aria-hidden={!open}>
          <div className="ks-grabber" />
          <div style={{ padding: '10px 20px 20px', display: 'grid', gap: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <Logo t={B.t} />
              <span style={{ flex: 1 }}><span className="ks-headline" style={{ fontWeight: 800 }}>{B.t}</span><br /><span className="ks-caption">{B.co}</span></span>
              <span className="ks-muted"><Icon d={ICON.close} size={22} /></span>
            </div>
            <div>
              <div className="ks-num" style={{ fontSize: 34, lineHeight: '38px', fontWeight: 800 }}>{$(B.price)}</div>
              <div className="ks-callout ks-gain ks-num" style={{ fontWeight: 700 }}>{pct(B.todayPct)} <span className="ks-muted" style={{ fontWeight: 500 }}>today · No one in {K.LEAGUE.name} owns {B.t}</span></div>
            </div>
            <div className="ks-seg" style={{ height: 40 }}><span className="on">Buy</span><span>Sell</span></div>
            <div className="ks-card" style={{ padding: 14, boxShadow: 'none', background: 'var(--c-sunken)', border: 0, display: 'grid', gap: 4 }}>
              <span className="ks-headline" style={{ fontWeight: 700 }}>You have {$(S.proceeds)} from selling {S.sold} to invest</span>
              <span className="ks-caption">Your slot's buying power is what the sale brought in, not a fresh {$(K.LEAGUE.notionalPerSlot)}.</span>
            </div>
            <div className="ks-card" style={{ padding: '2px 14px', boxShadow: 'none' }}>
              <ul className="ks-rows">
                <li className="ks-row" style={{ gridTemplateColumns: '1fr auto 16px', padding: '12px 0' }}>
                  <span className="ks-callout" style={{ fontWeight: 600 }}>Invest from</span>
                  <span className="ks-callout ks-muted ks-num">{S.sold} slot · {$(S.proceeds)}</span>
                  <span className="ks-muted"><Icon d={ICON.right} size={16} /></span>
                </li>
              </ul>
            </div>
            <div>
              <div className="ks-caption">You invest</div>
              <span className="ks-num" style={{ fontSize: 30, fontWeight: 800 }}>{$(S.proceeds)}</span>
              <div className="ks-caption ks-num">≈ {B.qty.toFixed(4)} shares at {$(B.price)}. The whole slot goes into {B.t}.</div>
            </div>
            <span className="ks-btn">Review buy</span>
          </div>
        </div>
      </>
    );
  }

  /** variant: 'live' (all six slots invested) | 'cash' (TSLA sold, its slot
   * holds the proceeds) | 'buy' (cash state with the buy sheet open). */
  function PortfolioScreen({ sheet, variant = 'live' }) {
    const P = K.PORTFOLIO_LIVE, S = K.SALE;
    const cash = variant === 'cash' || variant === 'buy';
    const rows = cash ? P.rows.filter((r) => r.t !== S.sold) : P.rows;
    const overlay = variant === 'buy' ? <BuySheet open /> : <StockSheet open={sheet} />;
    return (
      <Device tab="portfolio" label={variant === 'buy' ? 'Buying with sale proceeds' : cash ? 'Portfolio with a slot ready to invest' : sheet ? 'Portfolio with the NVDA sheet open' : 'Portfolio'} overlay={overlay}>
        <LeagueHead chip={<Chip kind="live">Live</Chip>} />
        <div className="ks-pad ks-stack">
          <div>
            <div className="ks-caption">Portfolio value{cash ? ' · includes cash' : ''}</div>
            <div className="ks-score ks-num" style={{ fontSize: 48, lineHeight: '50px', fontStretch: '75%' }}>{$(P.value)}</div>
            <div className="ks-callout ks-num" style={{ fontWeight: 700 }}>
              <span className="ks-gain">{$s(P.gain)} · {pct(P.gainPct)}</span> <span className="ks-muted" style={{ fontWeight: 500 }}>since the draft</span>
            </div>
            <div className="ks-callout ks-num" style={{ fontWeight: 700 }}>
              <span className="ks-gain">{$s(P.today)} · {pct(P.todayPct)}</span> <span className="ks-muted" style={{ fontWeight: 500 }}>today</span>
            </div>
          </div>
          <div className="ks-card" style={{ padding: '10px 14px', display: 'flex', justifyContent: 'space-between' }}>
            <span className="ks-callout"><b>{cash ? '5 of 6' : '6 of 6'}</b> slots invested</span>
            <span className="ks-callout ks-muted">{cash ? '1 ready to invest' : `${$(K.LEAGUE.notionalPerSlot)} per slot at the draft`}</span>
          </div>
          <div>
            <div className="ks-section-h"><h3>Holdings</h3><span className="ks-caption">Value · today</span></div>
            <div className="ks-card" style={{ padding: '2px 14px' }}>
              <ul className="ks-rows">
                {rows.map((r) => (
                  <li key={r.t} className="ks-row" style={{ gridTemplateColumns: '36px 1fr auto', background: sheet && r.t === 'NVDA' ? 'var(--c-sunken)' : undefined }}>
                    <Logo t={r.t} />
                    <span><span className="ks-t">{r.t}</span><br /><span className="ks-caption ks-num">{r.co} · {r.qty.toFixed(2)} sh</span></span>
                    <span className="ks-right ks-num"><b>{$(r.value)}</b><br /><span className={`ks-caption ${tone(r.todayPct)}`} style={{ fontWeight: 700 }}>{pct(r.todayPct)}</span></span>
                  </li>
                ))}
                {cash ? (
                  <li className="ks-row ks-fade-in" style={{ gridTemplateColumns: '36px 1fr auto' }}>
                    <span className="ks-logo" style={{ background: 'var(--c-gain-tint)', color: 'var(--c-gain)', fontSize: 16 }}>$</span>
                    <span><span className="ks-t">Cash</span><br /><span className="ks-caption">From selling {S.sold} · ready to invest</span></span>
                    <span className="ks-right ks-num"><b>{$(S.proceeds)}</b><br /><span className="ks-caption" style={{ color: 'var(--c-accent)', fontWeight: 700 }}>Invest ›</span></span>
                  </li>
                ) : null}
              </ul>
            </div>
          </div>
          <div className="ks-card" style={{ padding: '12px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span><b>Trade history</b><br /><span className="ks-caption">{cash ? `Sold ${S.sold} · includes your 6 draft picks` : 'Includes your 6 draft picks'}</span></span>
            <span className="ks-muted"><Icon d={ICON.right} size={18} /></span>
          </div>
        </div>
      </Device>
    );
  }

  // The building blocks, shared with inventory.jsx (step 2's screens).
  window.KSKit = { Device, LeagueHead, Chip, Icon, ICON, Logo, Scores, Tug, GainChart, WeekRace, ThisWeekCard, SD, margin, $, $s, pct, tone };
  window.KSScreens = { HomeScreen, MatchupScreen, LeagueScreen, DraftScreen, DraftSettingsScreen, PortfolioScreen };
})();

</script>
<script type="text/babel" data-presets="react">
// Step 2: the full screen inventory (Design Lead, 2026-09-29). Every screen
// the mobile phases 3b-1 / 3b-2 / 3c / 3e build, plus the 3d web shell.
// Same building blocks (window.KSKit), same league, same people, same money
// rules as the key screens. Existing app wording is kept verbatim (casing
// normalised to sentence case); new copy is marked on the board.

(function () {
  const { useState } = React;

  const { Device, Chip, Icon, ICON, Logo, Scores, Tug, SD, margin, $, $s, pct, tone } = window.KSKit;
  const BRAND = 'Stockpile'; // brand.name placeholder (naming deferred)

  // ── Small shared pieces ───────────────────────────────────────────────

  const Brand = () => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontWeight: 800, fontSize: 20 }}>

      {['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].map((r) => (

    </div>
  );
  const Empty = ({ icon, title, line, primary, secondary }) => (
    <div className="ks-card" style={{ padding: '28px 20px', display: 'grid', justifyItems: 'center', gap: 10, textAlign: 'center' }}>
      <span style={{ width: 64, height: 64, borderRadius: 32, display: 'grid', placeItems: 'center', background: 'var(--c-sunken)', color: 'var(--c-text-2)' }}><Icon d={icon} size={28} /></span>
      <span className="ks-title" style={{ fontSize: 20 }}>{title}</span>
      <span className="ks-callout ks-muted">{line}</span>
      {primary ? <span className="ks-btn" style={{ width: '100%', marginTop: 6 }}>{primary}</span> : null}
      {secondary ? <span className="ks-btn ks-btn--secondary" style={{ width: '100%' }}>{secondary}</span> : null}
    </div>

    );

      <svg width="72" height="96" viewBox="0 0 72 96" aria-hidden="true">
        <defs><clipPath id="sw-l"><rect width="36" height="96" /></clipPath><clipPath id="sw-r"><rect x="36" width="36" height="96" /></clipPath></defs>
