<style>
/* Key screens: the app's real screens as web components (Design Lead,
   2026-09-29). Every value comes from tokens.css (--sp-*, DESIGN_DIRECTION
   §9). Device geometry is iPhone 18 Pro class: 402 × 874 pt, a 54pt status
   area with the Dynamic Island, and an 83pt tab bar including the 34pt
   home indicator. Class prefix: ks- (landing port: rename to lp-/sp-). */

.ks-device {
  position: relative;
  width: 402px;
  height: 874px;
  border-radius: 56px;
  overflow: hidden;
  background: var(--sp-color-bg-app);
  font-family: var(--sp-type-family);
  color: var(--sp-color-text-primary);
  font-size: var(--sp-type-body-size);
  line-height: var(--sp-type-body-line);
  -webkit-font-smoothing: antialiased;
  isolation: isolate;
}
.ks-device--game { background: var(--sp-color-surface-game-base); color: var(--sp-color-text-on-game-primary); }

/* ── OS chrome ─────────────────────────────────────────────────────────── */
.ks-os {
  position: absolute; inset: 0 0 auto 0; height: 54px; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 34px 0 46px; font-weight: 600; font-size: 17px;
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.ks-os__island { position: absolute; left: 50%; top: 11px; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; }
.ks-os__icons { display: flex; gap: 6px; align-items: center; }
.ks-os__bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
.ks-os__bars i { width: 3px; background: currentColor; border-radius: 1px; }
.ks-os__bars i:nth-child(1) { height: 4px; } .ks-os__bars i:nth-child(2) { height: 6px; }
.ks-os__bars i:nth-child(3) { height: 9px; } .ks-os__bars i:nth-child(4) { height: 12px; }
.ks-os__batt { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1.5px; opacity: .9; }
.ks-os__batt i { display: block; height: 100%; width: 70%; background: currentColor; border-radius: 1.5px; }

.ks-scroll { position: absolute; inset: 54px 0 83px 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.ks-scroll::-webkit-scrollbar { display: none; }
.ks-pad { padding: 0 var(--sp-space-5); }
.ks-stack { display: flex; flex-direction: column; gap: var(--sp-space-5); padding-bottom: var(--sp-space-7); }

.ks-tabs {
  position: absolute; inset: auto 0 0 0; height: 83px; z-index: 5;
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px 8px 0;
  background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px);
  border-top: 1px solid var(--sp-color-border-default);
}
.ks-tabs__t { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--sp-color-text-secondary); font-size: 10.5px; font-weight: 600; }
.ks-tabs__t svg { width: 26px; height: 26px; }
.ks-tabs__t--on { color: var(--sp-color-brand); }
.ks-home-ind { position: absolute; left: 50%; bottom: 8px; width: 139px; height: 5px; margin-left: -69.5px; border-radius: 3px; background: var(--sp-color-text-primary); z-index: 6; }

/* ── Headers ───────────────────────────────────────────────────────────── */
.ks-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-space-3); padding: var(--sp-space-3) var(--sp-space-5) var(--sp-space-4); }
.ks-head__title { font-size: var(--sp-type-display-size); line-height: var(--sp-type-display-line); font-weight: var(--sp-type-display-weight); letter-spacing: var(--sp-type-display-tracking); margin: 0; }
.ks-avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--sp-color-brand); color: #fff; flex: none; }
.ks-avatar--sm { width: 28px; height: 28px; font-size: 11px; }
.ks-avatar--opp { background: var(--sp-color-team-opponent); color: var(--sp-color-surface-game-base); }
.ks-avatar--neutral { background: var(--sp-color-surface-game-line); color: var(--sp-color-text-on-game-primary); }
.ks-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 14px;
  border-radius: var(--sp-radius-pill); font-weight: 700; font-size: var(--sp-type-headline-size);
  background: var(--sp-color-surface-money-base); border: 1px solid var(--sp-color-border-default);
  max-width: 230px; white-space: nowrap;
}
.ks-pill span { overflow: hidden; text-overflow: ellipsis; }
.ks-device--game .ks-pill { background: var(--sp-color-surface-game-raised); border-color: var(--sp-color-surface-game-line); color: var(--sp-color-text-on-game-primary); }
.ks-pill svg { flex: none; width: 14px; height: 14px; opacity: .7; }

.ks-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
  border-radius: var(--sp-radius-pill); font-size: var(--sp-type-tag-size); line-height: 1;
  font-weight: var(--sp-type-tag-weight); font-stretch: var(--sp-type-tag-stretch);
  letter-spacing: var(--sp-type-tag-tracking); text-transform: uppercase; white-space: nowrap;
  background: var(--sp-color-surface-game-raised); color: var(--sp-color-text-on-game-primary);
}
.ks-chip--live { color: var(--sp-color-live); }
.ks-chip--final { background: var(--sp-color-text-on-game-primary); color: var(--sp-color-surface-game-base); }
.ks-chip--money { background: var(--sp-color-surface-money-sunken); color: var(--sp-color-text-secondary); }
.ks-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sp-color-live); flex: none; }
.ks-dot--pulse { animation: ks-pulse 1.6s var(--sp-motion-ease-settle) infinite; }
@keyframes ks-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 197, 61, .55); } 60% { box-shadow: 0 0 0 6px rgba(255, 197, 61, 0); } }

/* ── Type helpers ──────────────────────────────────────────────────────── */
.ks-tag { font-size: var(--sp-type-tag-size); line-height: var(--sp-type-tag-line); font-weight: var(--sp-type-tag-weight); font-stretch: var(--sp-type-tag-stretch); letter-spacing: var(--sp-type-tag-tracking); text-transform: uppercase; color: var(--sp-color-text-on-game-secondary); }
.ks-caption { font-size: var(--sp-type-caption-size); line-height: var(--sp-type-caption-line); font-weight: var(--sp-type-caption-weight); color: var(--sp-color-text-secondary); }
.ks-callout { font-size: var(--sp-type-callout-size); line-height: var(--sp-type-callout-line); font-weight: var(--sp-type-callout-weight); }
.ks-headline { font-size: var(--sp-type-headline-size); line-height: var(--sp-type-headline-line); font-weight: var(--sp-type-headline-weight); }
.ks-title { font-size: var(--sp-type-title-size); line-height: var(--sp-type-title-line); font-weight: var(--sp-type-title-weight); margin: 0; }
.ks-num { font-variant-numeric: tabular-nums; }
.ks-muted { color: var(--sp-color-text-secondary); }
.ks-device--game .ks-muted, .ks-game .ks-muted { color: var(--sp-color-text-on-game-secondary); }
.ks-gain { color: var(--sp-color-data-gain-base); } .ks-loss { color: var(--sp-color-data-loss-base); } .ks-zero { color: var(--sp-color-data-zero-base); }
.ks-game .ks-gain, .ks-device--game .ks-gain { color: var(--sp-color-data-gain-on-game); }
.ks-game .ks-loss, .ks-device--game .ks-loss { color: var(--sp-color-data-loss-on-game); }
.ks-game .ks-zero, .ks-device--game .ks-zero { color: var(--sp-color-data-zero-on-game); }
.ks-section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 var(--sp-space-3); }
.ks-section-h h3 { margin: 0; font-size: var(--sp-type-headline-size); line-height: var(--sp-type-headline-line); font-weight: 700; }

/* ── Scores (condensed 62%) + the shared ScoreRow ──────────────────────── */
.ks-score { font-weight: 900; font-stretch: 62%; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.01em; }
.ks-score--xl { font-size: var(--sp-type-score-xl-size); line-height: var(--sp-type-score-xl-line); }
.ks-score--lg { font-size: var(--sp-type-score-lg-size); line-height: var(--sp-type-score-lg-line); }
.ks-score--md { font-size: var(--sp-type-score-md-size); line-height: var(--sp-type-score-md-line); }
/* ScoreRow: two scores that can NEVER touch — a 1fr / 1fr grid with a
   ≥16px column gap; each score is fitted to its own column by ScoreRow's
   fit logic (both sides share the smaller size). */
.ks-scorerow { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--sp-space-5); align-items: end; }
.ks-scorerow > :last-child { text-align: right; }
.ks-rollin { animation: ks-rollin var(--sp-motion-duration-base) var(--sp-motion-ease-settle) both; }
@keyframes ks-rollin { from { transform: translateY(55%); opacity: 0; } to { transform: none; opacity: 1; } }

/* ── Tug bar ───────────────────────────────────────────────────────────── */
.ks-tug { display: flex; height: var(--sp-space-4); border-radius: var(--sp-radius-pill); overflow: hidden; background: var(--sp-color-surface-game-line); gap: 2px; }
.ks-tug__you { background: var(--sp-color-team-you-base); transition: flex-grow var(--sp-motion-duration-feature) var(--sp-motion-ease-settle); }
.ks-tug__opp { background: var(--sp-color-team-opponent); transition: flex-grow var(--sp-motion-duration-feature) var(--sp-motion-ease-settle); }

/* ── Cards ─────────────────────────────────────────────────────────────── */
.ks-card { background: var(--sp-color-surface-money-base); border-radius: var(--sp-radius-lg); box-shadow: var(--sp-elevation-money-card); border: 1px solid var(--sp-color-border-default); }
.ks-game { background: var(--sp-color-surface-game-base); color: var(--sp-color-text-on-game-primary); border-radius: var(--sp-radius-lg); }
.ks-raised { background: var(--sp-color-surface-game-raised); border-radius: var(--sp-radius-md); }

.ks-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: var(--sp-radius-md); background: var(--sp-color-surface-money-sunken); }
.ks-seg span { text-align: center; padding: 6px 0; border-radius: 8px; font-size: var(--sp-type-callout-size); font-weight: 600; color: var(--sp-color-text-secondary); }
.ks-seg .on { background: var(--sp-color-surface-money-base); color: var(--sp-color-text-primary); box-shadow: 0 1px 3px rgba(13, 27, 46, .12); }
.ks-seg--game { background: var(--sp-color-surface-game-raised); }
.ks-seg--game span { color: var(--sp-color-text-on-game-secondary); }
.ks-seg--game .on { background: var(--sp-color-surface-game-line); color: var(--sp-color-text-on-game-primary); box-shadow: none; }

.ks-btn { display: flex; align-items: center; justify-content: center; height: 50px; border-radius: var(--sp-radius-lg); font-weight: 700; font-size: var(--sp-type-headline-size); background: var(--sp-color-action-primary-bg); color: var(--sp-color-action-primary-fg); }
.ks-btn--ongame { background: var(--sp-color-action-primary-on-game-bg); color: var(--sp-color-action-primary-on-game-fg); }
.ks-btn--sell { background: var(--sp-color-data-loss-base); color: #fff; }

/* ── Lists ─────────────────────────────────────────────────────────────── */
.ks-rows { list-style: none; margin: 0; padding: 0; }
.ks-row { display: grid; align-items: center; gap: var(--sp-space-4); padding: 11px 0; border-top: 1px solid var(--sp-color-border-default); }
.ks-rows > .ks-row:first-child { border-top: 0; }
.ks-game .ks-row, .ks-device--game .ks-row { border-top-color: var(--sp-color-surface-game-line); }
.ks-logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 12px; background: var(--sp-color-surface-money-sunken); color: var(--sp-color-text-primary); letter-spacing: -0.02em; }
.ks-right { text-align: right; }
.ks-t { font-weight: 700; }

/* ── Home chart ────────────────────────────────────────────────────────── */
.ks-chart { display: block; width: 100%; height: 148px; overflow: visible; }
.ks-chart__line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.ks-draw { stroke-dasharray: var(--len); stroke-dashoffset: 0; }
.ks-draw--run { animation: ks-draw var(--sp-motion-duration-feature) var(--sp-motion-ease-settle) both; }
@keyframes ks-draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

/* ── Draft ─────────────────────────────────────────────────────────────── */
.ks-ring { position: relative; width: 84px; height: 84px; flex: none; }
.ks-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ks-ring__t { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-stretch: 62%; font-size: 30px; font-variant-numeric: tabular-nums; }
.ks-board { position: relative; }
.ks-board__cols, .ks-board__row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.ks-board__cols span { text-align: center; }
.ks-cell {
  position: relative; z-index: 1; height: 50px; border-radius: 10px; background: var(--sp-color-surface-game-raised);
  border: 1px solid var(--sp-color-surface-game-line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-variant-numeric: tabular-nums;
}
.ks-cell__n { font-size: 10px; line-height: 12px; color: var(--sp-color-text-on-game-secondary); font-weight: 600; }
.ks-cell__t { font-size: 12.5px; line-height: 15px; font-weight: 800; letter-spacing: -0.01em; }
.ks-cell--you { border-color: var(--sp-color-team-you-base); box-shadow: inset 0 0 0 1px var(--sp-color-team-you-base); }
.ks-cell--you .ks-cell__n { color: var(--sp-color-team-you-on-game); }
.ks-cell--future { background: transparent; border-style: dashed; }
.ks-cell--clock { border-color: transparent; background: var(--sp-color-surface-game-line); }
.ks-cell--clock::after {
  content: ''; position: absolute; inset: -4px; border-radius: 13px; border: 2px solid var(--sp-color-live);
  animation: ks-clock 1.2s var(--sp-motion-ease-settle) infinite alternate;
}
@keyframes ks-clock { from { opacity: 1; } to { opacity: .55; } }
.ks-cell--landed .ks-cell__t { animation: ks-land var(--sp-motion-duration-slow) var(--sp-motion-ease-settle) both; }
@keyframes ks-land { from { transform: translateY(8px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.ks-board__track { position: absolute; inset: 0; z-index: 0; overflow: visible; pointer-events: none; }
.ks-board__rlabel { display: flex; justify-content: space-between; margin: 6px 0; }
.ks-search { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: var(--sp-radius-md); background: var(--sp-color-surface-game-raised); border: 1px solid var(--sp-color-surface-game-line); }
.ks-search svg { width: 18px; height: 18px; color: var(--sp-color-text-on-game-secondary); }
.ks-caret { display: inline-block; width: 2px; height: 18px; background: var(--sp-color-team-you-on-game); margin-left: -6px; animation: ks-caret 1s steps(1) infinite; }
@keyframes ks-caret { 50% { opacity: 0; } }
.ks-slot { height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: var(--sp-type-callout-size); border: 1px dashed var(--sp-color-surface-game-line); color: var(--sp-color-text-on-game-secondary); }
.ks-slot--on { border: 0; background: var(--sp-color-team-you-base); color: #fff; }

/* ── Sheet ─────────────────────────────────────────────────────────────── */
.ks-scrim { position: absolute; inset: 0; z-index: 7; background: rgba(13, 27, 46, .38); transition: opacity var(--sp-motion-duration-base) var(--sp-motion-ease-settle); }
.ks-sheet {
